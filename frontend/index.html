      // 8. CHATS, LOST & FOUND, LEADERBOARD, PROFILE
      // -------------------------------------------------------------
      getMessagesHtml() {
        const user = stateObj.currentUser;
        if (!user) {
          return `
            <div class="h-[60vh] flex flex-col items-center justify-center text-center p-8 rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm">
              <div class="w-14 h-14 rounded-2xl bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800/50 flex items-center justify-center mb-3">
                <i data-lucide="message-square" class="w-7 h-7 text-blue-600 dark:text-blue-400"></i>
              </div>
              <h3 class="text-base font-bold text-slate-800 dark:text-white">Campus Direct Chat</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mt-1 mb-5">Please log in to your verified student account to coordinate physical exchanges and chat directly on the website.</p>
              <button onclick="App.navigateTo('login')" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-lg shadow-blue-500/25 cursor-pointer">Log In to Chat</button>
            </div>
          `;
        }
        const chats = stateObj.messages.filter(m => m.senderId === user.id || m.receiverId === user.id);
        const uniqueContacts = Array.from(new Set(chats.map(m => m.senderId === user.id ? m.receiverId : m.senderId)));

        const targetChat = this.viewParams && this.viewParams.chatWith;
        if (targetChat && !uniqueContacts.includes(targetChat)) {
          uniqueContacts.unshift(targetChat);
        }

        if (targetChat) {
          setTimeout(() => {
            if (this.currentView === 'messages') {
              this.selectChat(targetChat);
            }
          }, 60);
        }

        return `
          <div class="h-[80vh] flex rounded-3xl border border-slate-200 dark:border-slate-800 overflow-hidden bg-white dark:bg-slate-900 shadow-sm text-left">
            <div class="w-72 border-r border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 overflow-y-auto">
              <div class="p-4 border-b border-slate-200 dark:border-slate-800 font-bold text-xs flex items-center justify-between">
                <span>Conversations</span>
                <span class="text-[10px] bg-blue-100 dark:bg-blue-950 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded-full font-bold">On-Campus</span>
              </div>
              ${uniqueContacts.length === 0 ? '<div class="p-4 text-xs text-slate-400">No active messages yet.</div>' : uniqueContacts.map(cid => {
                const c = stateObj.users.find(u => u.id === cid);
                const name = c ? c.name : (stateObj.resources.find(r => r.ownerId === cid)?.ownerName || 'Campus Peer');
                return `
                  <div onclick="App.selectChat('${cid}')" class="p-4 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer text-xs font-bold border-b dark:border-slate-800 flex items-center gap-2.5 transition-colors">
                    <div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 flex items-center justify-center font-bold text-xs shrink-0">
                      ${name.charAt(0)}
                    </div>
                    <div class="truncate">
                      <div class="text-slate-800 dark:text-slate-200">${name}</div>
                      <div class="text-[10px] text-slate-400 font-normal">Student Peer</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div id="chat-feed-container" class="flex-1 flex flex-col justify-between">
              <div class="flex-1 flex flex-col items-center justify-center text-slate-400 text-xs gap-2 p-6 text-center">
                <i data-lucide="messages-square" class="w-8 h-8 text-slate-300 dark:text-slate-600"></i>
                <span>Select a conversation on the left to coordinate physical exchange on campus.</span>
              </div>
            </div>
          </div>
        `;
      },

      selectChat(partnerId) {
        const user = stateObj.currentUser;
        if (!user) return;
        const partner = stateObj.users.find(u => u.id === partnerId);
        const partnerName = partner ? partner.name : (stateObj.resources.find(r => r.ownerId === partnerId)?.ownerName || 'Campus Peer');
        const filtered = stateObj.messages.filter(m =>
          (m.senderId === user.id && m.receiverId === partnerId) ||
          (m.senderId === partnerId && m.receiverId === user.id)
        );

        const chatWindow = document.getElementById('chat-feed-container');
        if (!chatWindow) return;
        chatWindow.innerHTML = `
          <div class="p-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs">
                ${partnerName.charAt(0)}
              </div>
              <div>
                <div class="font-bold text-xs text-slate-900 dark:text-white">${partnerName}</div>
                <div class="text-[10px] text-emerald-500 font-medium flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Verified Campus Peer
                </div>
              </div>
            </div>
            <div class="text-[11px] text-slate-400 flex items-center gap-1">
              <i data-lucide="shield-check" class="w-3.5 h-3.5 text-blue-500"></i> In-Website Secure Chat
            </div>
          </div>
          <div class="flex-1 p-4 overflow-y-auto space-y-3" id="messages-box">
            ${filtered.length === 0 ? `
              <div class="py-12 text-center text-slate-400 text-xs space-y-1">
                <i data-lucide="message-square-plus" class="w-6 h-6 mx-auto text-slate-300 dark:text-slate-600 mb-2"></i>
                <div class="font-semibold text-slate-600 dark:text-slate-300">Start the conversation with ${partnerName.split(' ')[0]}</div>
                <div>Send a message below to coordinate meetup location, exam timings, or item condition.</div>
              </div>
            ` : filtered.map(m => `
              <div class="flex ${m.senderId === user.id ? 'justify-end' : 'justify-start'}">
                <div class="p-3 rounded-2xl text-xs max-w-[70%] ${
                  m.senderId === user.id ? 'bg-blue-600 text-white rounded-tr-none shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 rounded-tl-none'
                }">
                  ${m.content}
                </div>
              </div>
            `).join('')}
          </div>
          <form onsubmit="App.sendMsg(event, '${partnerId}')" class="p-4 border-t border-slate-200 dark:border-slate-800 flex gap-2">
            <input type="text" id="chat-input-box" placeholder="Coordinate meetup place or time on campus..." class="flex-1 p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20">
            <button type="submit" class="px-5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md shadow-blue-500/20 cursor-pointer">Send</button>
          </form>
        `;
        if (window.lucide) window.lucide.createIcons();
        const box = document.getElementById('messages-box');
        if (box) box.scrollTop = box.scrollHeight;
      },

      sendMsg(e, partnerId) {
        e.preventDefault();
        const user = stateObj.currentUser;
        const val = document.getElementById('chat-input-box').value;
        if (!val.trim()) return;

        const newMsg = {
          id: 'msg_' + Date.now().toString(36),
          senderId: user.id,
          receiverId: partnerId,
          content: val,
          timestamp: new Date().toISOString()
        };

        stateObj.messages.push(newMsg);
        stateObj.save();

        this.selectChat(partnerId);

        setTimeout(() => {
          stateObj.messages.push({
            id: 'msg_reply_' + Date.now().toString(36),
            senderId: partnerId,
            receiverId: user.id,
            content: `Understood! Let's meet at the library desk.`,
            timestamp: new Date().toISOString()
          });
          stateObj.save();
          this.selectChat(partnerId);
        }, 1500);
      },

      getLostFoundHtml() {
        return `
          <div class="space-y-6 text-left">
            <div class="flex justify-between items-center">
              <div>
                <h1 class="text-2xl font-bold">Lost & Found Hub</h1>
                <p class="text-slate-400 text-xs mt-1">Help recover misplaced college equipment.</p>
              </div>
              <button onclick="App.createLostFoundPost()" class="px-4 py-2.5 bg-brand-600 text-white rounded-xl text-xs font-bold">+ Post Item</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              ${stateObj.lostAndFound.length === 0 ? '<div class="p-12 text-center text-xs text-slate-400 col-span-2">No lost & found posts.</div>' : stateObj.lostAndFound.map(lf => `
                <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between hover-lift">
                  <div>
                    <span class="px-2.5 py-0.5 rounded-full text-[9px] font-bold uppercase ${lf.type === 'lost' ? 'bg-rose-500/10 text-rose-500' : 'bg-emerald-500/10 text-emerald-500'}">${lf.type}</span>
                    <h3 class="font-bold text-sm text-slate-800 dark:text-white mt-3">${lf.title}</h3>
                    <p class="text-xs text-slate-400 mt-2">${lf.description}</p>
                  </div>
                  <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
                    <span>By: ${lf.posterName}</span>
                    <button onclick="App.navigateTo('messages', {chatWith: '${lf.posterId}'})" class="px-3 py-1.5 bg-brand-600 text-white rounded-lg font-bold">Message</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      },

      createLostFoundPost() {
        const title = window.prompt('Enter item title (e.g. Found Blue Scientific Calculator):');
        const desc = window.prompt('Enter details (room found, contact info):');
        if (!title || !desc) return;

        const user = stateObj.currentUser;
        stateObj.lostAndFound.unshift({
          id: 'lf_' + Date.now().toString(36),
          posterId: user.id,
          posterName: user.name,
          title,
          description: desc,
          type: 'found',
          generalLocation: 'Campus',
          date: new Date().toISOString().split('T')[0],
          status: 'open'
        });
        stateObj.save();
        showToast('Lost & Found notice published.');
        this.render();
      },

      getLeaderboardHtml() {
        const ranked = [...stateObj.users].filter(u => u.role !== 'admin' && u.emailVerified).sort((a,b) => b.trustScore - a.trustScore);

        return `
          <div class="space-y-6 text-left">
            <div>
              <h1 class="text-2xl font-bold">Campus Trust & Contribution Leaderboard</h1>
              <p class="text-slate-400 text-xs mt-1">Recognizing students maintaining on-time returns and high trust levels.</p>
            </div>

            <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
              <div class="space-y-4">
                ${ranked.length === 0 ? '<div class="text-slate-500 text-xs py-8 text-center">No students registered yet.</div>' : ranked.map((u, i) => {
                  const trust = getTrustLevel(u);
                  return `
                    <div class="flex items-center justify-between py-3 border-b border-slate-100 dark:border-slate-800 last:border-b-0 text-xs">
                      <div class="flex items-center gap-3">
                        <span class="font-bold text-slate-400 w-6 text-center">${i+1}</span>
                        <div class="w-8 h-8 rounded-lg bg-brand-500/10 flex items-center justify-center font-bold text-brand-600">${u.name.charAt(0)}</div>
                        <div>
                          <span class="font-bold block">${u.name}</span>
                          <span class="text-[10px] text-slate-400">${u.department}</span>
                        </div>
                      </div>
                      <div class="flex items-center gap-3">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${trust.badgeClass}">${trust.level}</span>
                        <span class="font-bold text-emerald-500 text-sm">${u.trustScore} pts</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      },

      getProfileHtml(userId) {
        const u = stateObj.users.find(userObj => userObj.id === userId) || stateObj.currentUser;
        const trust = getTrustLevel(u);
        const userListings = stateObj.resources.filter(r => r.ownerId === u.id);
        const completedReturns = stateObj.transactions.filter(t => t.borrowerId === u.id && t.status === 'Returned').length;

        return `
          <div class="space-y-6 text-left max-w-2xl mx-auto">
            <div class="p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
              <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-gradient-to-tr from-brand-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl shadow-lg">${u.name.charAt(0)}</div>
                <div>
                  <h2 class="text-xl font-bold">${u.name}</h2>
                  <p class="text-xs text-slate-400">${u.department} • Mobile: ${u.mobileNumber || 'N/A'}</p>
                  <div class="mt-2 flex items-center gap-2">
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${trust.badgeClass}">${trust.level} Standing</span>
                    <span class="text-xs text-slate-500">Trust Score: <strong>${u.trustScore}/100</strong></span>
                    <span class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-emerald-500/10 text-emerald-600">Email Verified</span>
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-4 pt-4 border-t border-slate-100 dark:border-slate-800 text-center text-xs">
                <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/40">
                  <span class="text-[10px] text-slate-400 block uppercase font-bold">Items Listed</span>
                  <strong class="text-lg font-black block mt-0.5">${userListings.length}</strong>
                </div>
                <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/40">
                  <span class="text-[10px] text-slate-400 block uppercase font-bold">Successful Returns</span>
                  <strong class="text-lg font-black text-emerald-500 block mt-0.5">${completedReturns}</strong>
                </div>
                <div class="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/40">
                  <span class="text-[10px] text-slate-400 block uppercase font-bold">Account Role</span>
                  <strong class="text-lg font-black capitalize block mt-0.5">${u.role}</strong>
                </div>
              </div>
            </div>
          </div>
        `;
      },

      // -------------------------------------------------------------
      // 9. ADMIN DASHBOARD & DISPUTES ARBITRATION
      // -------------------------------------------------------------
      getAdminHtml() {
        const allTxs = stateObj.transactions;
        const pendingRequestsCount = allTxs.filter(t => t.status === 'Pending Request').length;
        const activeBorrowingsCount = allTxs.filter(t => t.status === 'Active Borrow' || t.status === 'Return Requested').length;
        const overdueTxs = allTxs.filter(t => t.status === 'Overdue');
        const disputedTxs = allTxs.filter(t => t.status === 'Disputed');
        const returnedTxs = allTxs.filter(t => t.status === 'Returned');
        
        const totalDepositsRecorded = allTxs
          .filter(t => ['Paid/Held', 'Released', 'Partially Deducted', 'Fully Deducted'].includes(t.depositStatus))
          .reduce((acc, t) => acc + (t.securityDeposit || 0), 0);

        const verifiedStudents = stateObj.users.filter(u => u.role !== 'admin' && u.emailVerified);
        const restrictedStudents = verifiedStudents.filter(u => getTrustLevel(u).level === 'Restricted');

        return `
          <div class="space-y-8 text-left">
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-2xl font-bold text-rose-600 dark:text-rose-400">Admin Arbitration & Oversight</h1>
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/10 text-rose-600">Full Access</span>
              </div>
              <p class="text-slate-500 text-xs mt-1">Resolve deposit deduction disputes, inspect overdue borrowings, moderate students, and review transaction logs.</p>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                <span class="text-[10px] text-slate-400 block uppercase font-bold">Active Borrowings</span>
                <strong class="text-2xl font-black block mt-1 text-slate-900 dark:text-white">${activeBorrowingsCount}</strong>
              </div>
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                <span class="text-[10px] text-slate-400 block uppercase font-bold">Pending Requests</span>
                <strong class="text-2xl font-black block mt-1 text-amber-500">${pendingRequestsCount}</strong>
              </div>
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                <span class="text-[10px] text-slate-400 block uppercase font-bold">Overdue Items</span>
                <strong class="text-2xl font-black text-rose-500 block mt-1">${overdueTxs.length}</strong>
              </div>
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                <span class="text-[10px] text-slate-400 block uppercase font-bold">Total Deposits Recorded</span>
                <strong class="text-2xl font-black text-emerald-500 block mt-1">₹${totalDepositsRecorded}</strong>
              </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-5">
              <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm text-xs">
                <span class="text-slate-400 block font-semibold">Disputed Transactions:</span>
                <strong class="text-lg font-bold text-purple-600 dark:text-purple-400">${disputedTxs.length} cases</strong>
              </div>
              <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm text-xs">
                <span class="text-slate-400 block font-semibold">Returned Items:</span>
                <strong class="text-lg font-bold text-emerald-600">${returnedTxs.length} completed</strong>
              </div>
              <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm text-xs">
                <span class="text-slate-400 block font-semibold">Verified Students:</span>
                <strong class="text-lg font-bold text-slate-900 dark:text-white">${verifiedStudents.length} students</strong>
              </div>
            </div>

            <!-- DISPUTES RESOLUTION PANEL -->
            <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
              <h3 class="font-bold text-sm text-purple-600 dark:text-purple-400 flex items-center gap-2">
                <i data-lucide="scale" class="w-4 h-4"></i>
                Deposit Deduction Disputes (${disputedTxs.length})
              </h3>

              ${disputedTxs.length === 0 ? '<p class="text-xs text-slate-400 py-4 text-center">No active deposit disputes.</p>' : `
                <div class="space-y-4">
                  ${disputedTxs.map(tx => `
                    <div class="p-5 rounded-2xl bg-purple-50/50 dark:bg-purple-950/20 border border-purple-200/60 dark:border-purple-800/60 space-y-3 text-xs">
                      <div class="flex items-center justify-between">
                        <span class="font-bold text-sm">${tx.resourceName}</span>
                        <span class="font-bold text-purple-600">Disputed Deposit: ₹${tx.securityDeposit} (Deduction: ₹${tx.deductionAmount})</span>
                      </div>

                      <div class="grid grid-cols-2 gap-4 p-3 bg-white dark:bg-slate-900 rounded-xl">
                        <div>
                          <span class="text-[10px] text-slate-400 font-bold block uppercase">Owner Claim (${tx.ownerName})</span>
                          <p class="mt-0.5">"${tx.deductionReason}"</p>
                        </div>
                        <div>
                          <span class="text-[10px] text-slate-400 font-bold block uppercase">Borrower Statement (${tx.borrowerName})</span>
                          <p class="mt-0.5">"${tx.borrowerDisputeNote || 'Disputed deduction claim'}"</p>
                        </div>
                      </div>

                      <div class="flex items-center justify-between pt-2">
                        <button onclick="App.viewConditionPhotos('${tx.id}')" class="text-brand-500 font-bold hover:underline">Inspect Photos</button>
                        <div class="flex gap-2">
                          <button onclick="App.adminResolveDispute('${tx.id}', 'refund_borrower')" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg font-bold">Refund Full to Borrower</button>
                          <button onclick="App.adminResolveDispute('${tx.id}', 'grant_owner')" class="px-3 py-1.5 bg-rose-600 text-white rounded-lg font-bold">Approve Owner Deduction</button>
                          <button onclick="App.adminResolveDispute('${tx.id}', 'split')" class="px-3 py-1.5 bg-purple-600 text-white rounded-lg font-bold">Split 50/50</button>
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- OVERDUE ITEMS TABLE -->
            <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
              <h3 class="font-bold text-sm text-rose-500 flex items-center gap-2">
                <i data-lucide="alert-octagon" class="w-4 h-4"></i>
                Overdue Borrowings Oversight (${overdueTxs.length})
              </h3>
              ${overdueTxs.length === 0 ? '<p class="text-xs text-slate-400 py-3 text-center">No overdue items currently recorded.</p>' : `
                <div class="divide-y divide-slate-100 dark:divide-slate-800 text-xs">
                  ${overdueTxs.map(tx => `
                    <div class="py-3 flex items-center justify-between">
                      <div>
                        <span class="font-bold block">${tx.resourceName}</span>
                        <span class="text-[10px] text-slate-400">Borrower: ${tx.borrowerName} • Owner: ${tx.ownerName} • Deposit: ₹${tx.securityDeposit}</span>
                      </div>
                      <button onclick="App.warnUser('${tx.borrowerId}', '${tx.resourceName}')" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-bold text-[10px]">Send Penalty Warning</button>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- STUDENT CONTROL & RESTRICTION LIST -->
            <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
              <h3 class="font-bold text-xs uppercase tracking-wider text-slate-400">Verified Student Directory</h3>
              <div class="divide-y divide-slate-100 dark:divide-slate-800">
                ${verifiedStudents.length === 0 ? '<div class="text-xs text-slate-400 py-4">No registered verified students yet.</div>' : verifiedStudents.map(student => {
                  const stTrust = getTrustLevel(student);
                  return `
                    <div class="flex items-center justify-between py-3 text-xs">
                      <div>
                        <span class="font-bold block">${student.name} <span class="text-[10px] text-slate-400 font-normal">(${student.department} • ${student.mobileNumber || 'No Phone'})</span></span>
                        <span class="text-[10px] text-slate-400">Trust: <strong>${student.trustScore} pts</strong> • Level: <span class="font-bold ${stTrust.badgeClass} px-1.5 py-0.2 rounded-full">${stTrust.level}</span> • Email: <span class="text-emerald-500 font-bold">Verified</span></span>
                      </div>
                      <button onclick="App.toggleBlock('${student.id}')" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-white ${
                        student.status === 'blocked' ? 'bg-emerald-600' : 'bg-rose-600'
                      }">
                        ${student.status === 'blocked' ? 'Unblock' : 'Block Student'}
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      },

      adminResolveDispute(txId, action) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        tx.status = 'Returned';
        tx.actualReturnDate = new Date().toISOString().split('T')[0];

        if (action === 'refund_borrower') {
          tx.depositStatus = 'Released';
          tx.deductionAmount = 0;
          showToast('Dispute resolved: Full deposit refunded to borrower.');
        } else if (action === 'grant_owner') {
          tx.depositStatus = tx.deductionAmount >= (tx.securityDeposit || 0) ? 'Fully Deducted' : 'Partially Deducted';
          showToast(`Dispute resolved: Approved ₹${tx.deductionAmount} deduction for owner.`);
        } else if (action === 'split') {
          tx.deductionAmount = Math.round((tx.securityDeposit || 0) / 2);
          tx.depositStatus = 'Partially Deducted';
          showToast(`Dispute resolved: 50/50 split applied (₹${tx.deductionAmount} deducted).`);
        }

        const res = stateObj.resources.find(r => r.id === tx.resourceId);
        if (res) res.availability = 'available';

        stateObj.notifications.unshift({
          id: 'n_adm_res_' + Date.now().toString(36),
          userId: tx.borrowerId,
          content: `⚖️ Admin Arbitration Closed: Dispute for "${tx.resourceName}" resolved with status: ${tx.depositStatus}.`,
          type: 'dispute_resolved',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.notifications.unshift({
          id: 'n_adm_res_o_' + Date.now().toString(36),
          userId: tx.ownerId,
          content: `⚖️ Admin Arbitration Closed: Dispute for "${tx.resourceName}" resolved with status: ${tx.depositStatus}.`,
          type: 'dispute_resolved',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        this.render();
      },

      toggleBlock(id) {
        const student = stateObj.users.find(u => u.id === id);
        if (student) {
          student.status = student.status === 'blocked' ? 'active' : 'blocked';
          stateObj.save();
          showToast(`Student status updated.`);
          this.render();
        }
      },

      warnUser(userId, resName) {
        stateObj.notifications.unshift({
          id: 'n_' + Date.now().toString(36),
          userId,
          content: `ADMIN PENALTY WARNING: Return the overdue resource "${resName}" immediately to avoid suspension.`,
          type: 'overdue_warning',
          createdAt: new Date().toISOString(),
          isRead: false
        });
        stateObj.save();
        showToast('Penalty warning sent.');
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
