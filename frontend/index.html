    // Helper SHA-256 Hasher for Client-Side Security Simulation
    async function hashString(str) {
      const buffer = new TextEncoder().encode(str + "_salt_campushare_2026");
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    class CampusShareState {
      constructor() {
        this.load();
        this.checkOverdueAndReminders();
      }

      load() {
        const cached = localStorage.getItem('campushare_state_v4');
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            this.currentUser = parsed.currentUser || null;
            this.users = parsed.users || INITIAL_USERS;
            if (!this.users.some(u => u.email === 'tejasmahajan1002@gmail.com')) {
              this.users.push(INITIAL_USERS[1]);
            }
            this.resources = parsed.resources && parsed.resources.length > 0 ? parsed.resources : [];
            this.transactions = parsed.transactions || [];
            this.notifications = parsed.notifications || [];
            this.messages = parsed.messages || [];
            this.reports = parsed.reports || [];
            this.lostAndFound = parsed.lostAndFound || [];
            this.borrowRequests = parsed.borrowRequests || [];
            this.exchangeRequests = parsed.exchangeRequests || [];
            this.ratings = parsed.ratings || [];
            this.pendingRegistrations = parsed.pendingRegistrations || [];
            this.studyFolders = parsed.studyFolders || [];
            this.studyMaterials = parsed.studyMaterials || [];

            // Purge fake mock/sample items so only genuine user-created listings remain
            this.resources = (this.resources || []).filter(r => 
              r && r.id && !r.id.startsWith('res_sample_') && !['res_1', 'res_2', 'res_3'].includes(r.id)
            );
            this.save();
          } catch(e) {
            this.resetToInitial();
          }
        } else {
          this.resetToInitial();
        }
      }

      

      resetToInitial() {
        this.currentUser = null;
        this.users = INITIAL_USERS;
        this.resources = [];
        this.transactions = [];
        this.notifications = [];
        this.messages = [];
        this.reports = [];
        this.lostAndFound = [];
        this.borrowRequests = [];
        this.exchangeRequests = [];
        this.ratings = [];
        this.pendingRegistrations = [];
        this.studyFolders = [];
        this.studyMaterials = [];
        this.save();
      }

      save() {
        localStorage.setItem('campushare_state_v4', JSON.stringify({
          currentUser: this.currentUser,
          users: this.users,
          resources: this.resources,
          transactions: this.transactions,
          notifications: this.notifications,
          messages: this.messages,
          reports: this.reports,
          lostAndFound: this.lostAndFound,
          borrowRequests: this.borrowRequests,
          exchangeRequests: this.exchangeRequests,
          ratings: this.ratings,
          pendingRegistrations: this.pendingRegistrations,
          studyFolders: this.studyFolders,
          studyMaterials: this.studyMaterials
        }));
      }

      checkOverdueAndReminders() {
        const now = new Date();
        let changed = false;

        this.transactions.forEach(tx => {
          if (tx.status === 'Active Borrow' || tx.status === 'Return Requested') {
            const dueDate = new Date(tx.expectedReturnDate);
            const diffHours = (dueDate - now) / (1000 * 60 * 60);

            if (diffHours < 0 && tx.status !== 'Overdue') {
              tx.status = 'Overdue';
              changed = true;

              const borrower = this.users.find(u => u.id === tx.borrowerId);
              if (borrower && borrower.trustScore > 20) {
                borrower.trustScore = Math.max(20, borrower.trustScore - 10);
              }

              this.notifications.unshift({
                id: 'n_ovd_' + Date.now() + Math.random().toString(36).substring(7),
                userId: tx.borrowerId,
                content: `⚠️ OVERDUE WARNING: Your borrowed item "${tx.resourceName}" is past its return date (${dueDate.toLocaleDateString()}). Return it immediately to avoid further trust penalties.`,
                type: 'overdue_alert',
                createdAt: new Date().toISOString(),
                isRead: false
              });

              this.notifications.unshift({
                id: 'n_ovd_own_' + Date.now() + Math.random().toString(36).substring(7),
                userId: tx.ownerId,
                content: `⚠️ OVERDUE NOTICE: "${tx.resourceName}" borrowed by ${tx.borrowerName} is now overdue. You can contact them or propose deduction.`,
                type: 'overdue_alert',
                createdAt: new Date().toISOString(),
                isRead: false
              });

              this.notifications.unshift({
                id: 'n_ovd_adm_' + Date.now() + Math.random().toString(36).substring(7),
                userId: 'u_admin',
                content: `OVERDUE TRANSACTION: ${tx.borrowerName} has not returned "${tx.resourceName}" to ${tx.ownerName}.`,
                type: 'admin_alert',
                createdAt: new Date().toISOString(),
                isRead: false
              });
            }
          }
        });

        if (changed) {
          this.save();
        }
      }
    }

    function getTrustLevel(user) {
      if (!user) return { level: 'Good', badgeClass: 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/20' };
      
      const hasOverdueOrDispute = stateObj.transactions.some(t => 
        t.borrowerId === user.id && (t.status === 'Overdue' || t.status === 'Disputed')
      );

      if (hasOverdueOrDispute || user.trustScore < 50 || user.status === 'blocked') {
        return { level: 'Restricted', badgeClass: 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/20' };
      }
      if (user.trustScore >= 90) {
        return { level: 'Excellent', badgeClass: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20' };
      }
      if (user.trustScore >= 75) {
        return { level: 'Good', badgeClass: 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/20' };
      }
      return { level: 'Average', badgeClass: 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/20' };
    }

        const match = stateObj.users.find(u => u.email.toLowerCase() === email);

        const isCorrectPassword = pass === match.password;

          return;
        }

        stateObj.save();

      async handleRegisterSubmit() {
        const zprnInput = document.getElementById('reg-zprn');
        const passInput = document.getElementById('reg-pass');
        const passConfirmInput = document.getElementById('reg-pass-confirm');

        if (!zprnInput || !passInput || !passConfirmInput) return;

        const zprn = zprnInput.value.trim().toUpperCase();
        const pass = passInput.value;
        const passConfirm = passConfirmInput.value;

        if (!zprn || !pass || !passConfirm) {
          showToast('Please enter your ZPRN and password.', 'error');
          return;
        }

        // Automatically detect student name & email from roster
        const studentInfo = STUDENT_DIRECTORY.find(s => s.zprn.toUpperCase() === zprn);
        if (!studentInfo) {
          showToast('Invalid ZPRN Number. Only registered ECE students are allowed to register.', 'error');
          return;
        }

        const name = studentInfo.name;
        const email = studentInfo.email.toLowerCase();
        const roll = zprn;
        const dept = 'Electronics and Computer Engineering';
        const year = '1st Year';
        const sem = '1st Sem';
        const mobile = '';

        if (pass !== passConfirm) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        if (pass.length < 6) {
          showToast('Password must be at least 6 characters.', 'error');
          return;
        }

        // Check if verified email already exists
        const exists = stateObj.users.some(u => u.email.toLowerCase() === email && u.emailVerified);
        if (exists) {
          showToast('An active verified account with this email already exists.', 'error');
          return;
        }

        // Store pending unverified registration locally with auto-detected profile
        const pendingUser = {
          id: 'u_' + Date.now().toString(36),
          name,
          email,
          mobileNumber: mobile,
          rollNumber: roll,
          department: dept,
          year,
          semester: sem,
          password: pass,
          role: 'student',
          trustScore: 75,
          ratingAverage: 0,
          status: 'active',
          emailVerified: false,
          otpExpiry: Date.now() + 5 * 60 * 1000,
          otpAttempts: 0,
          lastOtpRequestAt: Date.now()
        };

        stateObj.pendingRegistrations = stateObj.pendingRegistrations.filter(p => p.email !== email);
        stateObj.pendingRegistrations.push(pendingUser);
        stateObj.save();

        // Dispatch Real-Time Email via Node Backend & PHP Backend
        try {
          const res = await fetch('http://localhost:5000/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              zprn,
              password: pass,
              confirmPassword: passConfirm
            })
          });
          const data = await res.json();
          if (res.ok && data && data.otp) {
            pendingUser.otpHash = await hashString(data.otp);
            stateObj.save();
          } else {
            throw new Error(data.message || 'Failed to dispatch email');
          }
        } catch(e) {
          const simulatedOtp = '123456';
          pendingUser.otpHash = await hashString(simulatedOtp);
          stateObj.save();
          console.log(`[SIMULATED REGISTRATION CODE for ${email} (${name})]: ${simulatedOtp}`);
          showToast(`[SIMULATED] Server offline. Verification OTP for ${name} is ${simulatedOtp}`, 'warning');
          
          try {
            fetch('php_backend/register.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name, email, mobileNumber: mobile, rollNumber: roll,
                department: dept, year, semester: sem,
                password: pass, confirmPassword: passConfirm
              })
            }).catch(() => {});
          } catch(err) {}
        }

        showToast(`6-Digit Verification code sent to ${email} for ${name}! Check your inbox.`);
        this.navigateTo('verify_email', { email });
      },

      async handleResetPasswordSubmit(email) {
        const otp = document.getElementById('reset-otp').value.trim();
        const newPassword = document.getElementById('reset-pass').value;
        const confirmPassword = document.getElementById('reset-pass-confirm').value;

        if (!otp || !newPassword || !confirmPassword) {
          showToast('Please fill all fields.', 'error');
          return;
        }

        if (newPassword !== confirmPassword) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        if (newPassword.length < 6) {
          showToast('Password must be at least 6 characters.', 'error');
          return;
        }

        try {
          // Attempt Node API backend call
          const res = await fetch('http://localhost:5000/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp, newPassword, confirmPassword })
          });
          const data = await res.json();
          if (res.ok) {
            showToast(data.message);
            this.navigateTo('login');
          } else {
            throw new Error(data.message || 'Reset failed.');
          }
        } catch (e) {
          // Fallback simulation mode
          const user = stateObj.users.find(u => u.email.toLowerCase() === email);
          if (!user) {
            showToast('Account not found.', 'error');
            return;
          }

          if (user.otpAttempts >= 5) {
            showToast('Maximum reset attempts exceeded. Please request a new code.', 'error');
            return;
          }

          if (Date.now() > user.otpExpiry) {
            showToast('Reset verification code has expired. Request a new one.', 'error');
            return;
          }

          if (user.otpCode !== otp) {
            user.otpAttempts = (user.otpAttempts || 0) + 1;
            stateObj.save();
            const left = Math.max(0, 5 - user.otpAttempts);
            showToast(`Incorrect reset code. ${left} attempt(s) left.`, 'error');
            return;
          }

          // Successful Reset
          user.password = newPassword;
          user.otpCode = null;
          user.otpExpiry = null;
          user.otpAttempts = 0;
          stateObj.save();

          showToast('Password updated successfully. You can now login.');
          this.navigateTo('login');
        }
      },

      startResendTimer(seconds = 60) {
        if (this.resendTimerInterval) {
          clearInterval(this.resendTimerInterval);
        }

        this.resendCountdown = seconds;
        const updateUI = () => {
          const btn = document.getElementById('resend-otp-btn');
          const span = document.getElementById('resend-timer-span');
          if (btn && span) {
            if (this.resendCountdown > 0) {
              btn.disabled = true;
              span.textContent = `(${this.resendCountdown}s)`;
            } else {
              btn.disabled = false;
              span.textContent = '';
            }
          }
        };

        updateUI();

        this.resendTimerInterval = setInterval(() => {
          this.resendCountdown--;
          updateUI();
          if (this.resendCountdown <= 0) {
            clearInterval(this.resendTimerInterval);
            this.resendTimerInterval = null;
          }
        }, 1000);
      },

      async handleResendOtp() {
        if (this.resendCountdown > 0) return;

        const email = this.viewParams.email;
        const pending = stateObj.pendingRegistrations.find(p => p.email === email);
        if (!pending) {
          showToast('No pending registration found. Please register again.', 'error');
          this.navigateTo('register');
          return;
        }

        // Rate Limiting Check (60 seconds)
        const elapsed = (Date.now() - (pending.lastOtpRequestAt || 0)) / 1000;
        if (elapsed < 60) {
          const wait = Math.ceil(60 - elapsed);
          showToast(`Please wait ${wait} second(s) before requesting a new code.`, 'error');
          this.startResendTimer(wait);
          return;
        }

        pending.otpExpiry = Date.now() + 5 * 60 * 1000;
        pending.otpAttempts = 0;
        pending.lastOtpRequestAt = Date.now();
        stateObj.save();

        // Dispatch Real-Time Resend Email to Node Backend (Port 5000) and PHP Backend (XAMPP)
        try {
          const res = await fetch('http://localhost:5000/api/auth/resend-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          if (res.ok && data && data.otp) {
            pending.otpHash = await hashString(data.otp);
            stateObj.save();
          } else {
            throw new Error(data.message || 'Resend failed');
          }

          fetch('php_backend/resend_otp.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          }).catch(() => {});
        } catch(e) {
          const simulatedOtp = '123456';
          pending.otpHash = await hashString(simulatedOtp);
          stateObj.save();
          console.log(`[SIMULATED RESEND CODE for ${email}]: ${simulatedOtp}`);
          showToast(`[SIMULATED] Since backend is offline, please enter the simulated OTP: ${simulatedOtp}`, 'warning');
        }

        showToast(`Fresh verification code sent to ${email}!`);
        this.startResendTimer(60);
        this.render();
      },

      async handleVerifyOtpSubmit() {
        const email = this.viewParams.email;
        const otpInput = document.getElementById('otp-code-input');
        const otp = otpInput ? otpInput.value.trim() : '';

        if (!otp || otp.length !== 6 || !/^\d+$/.test(otp)) {
          showToast('Please enter the 6-digit verification code sent to your email.', 'error');
          return;
        }

        const pending = stateObj.pendingRegistrations.find(p => p.email === email);
        if (!pending) {
          showToast('Registration session not found. Please register again.', 'error');
          this.navigateTo('register');
          return;
        }

        // 2. Check 5-Minute Expiry
        if (Date.now() > pending.otpExpiry) {
          showToast('Verification code has expired (5-minute validity). Please click Resend Code.', 'error');
          return;
        }

        let verifiedOnBackend = false;

        // Try Node Backend verification first
        try {
          const res = await fetch('http://localhost:5000/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            verifiedOnBackend = true;
          } else if (res.status === 400 || res.status === 429) {
            pending.otpAttempts = (pending.otpAttempts || 0) + 1;
            stateObj.save();
            const remaining = Math.max(0, 5 - pending.otpAttempts);
            showToast(data.message || `Invalid code. ${remaining} attempt(s) remaining.`, 'error');
            this.render();
            return;
          }
        } catch(e) {
          // Try PHP backend
          try {
            const phpRes = await fetch('php_backend/verify_otp.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, otp })
            });
            const phpData = await phpRes.json();
            if (phpRes.ok && phpData.success) {
              verifiedOnBackend = true;
            }
          } catch(err) {}
        }

        // Verify against hash or backend confirmation
        const inputHash = await hashString(otp);
        if (verifiedOnBackend || (pending.otpHash && inputHash === pending.otpHash)) {
          pending.emailVerified = true;
          delete pending.otpHash;
          delete pending.otpExpiry;
          delete pending.otpAttempts;
          delete pending.demoOtp;

          stateObj.pendingRegistrations = stateObj.pendingRegistrations.filter(p => p.email !== email);
          stateObj.users = stateObj.users.filter(u => u.email !== email);
          stateObj.users.push(pending);
          stateObj.currentUser = pending;
          stateObj.save();

          showToast('Email verified successfully! Profile activated.');
          this.navigateTo('dashboard');
        } else {
          pending.otpAttempts = (pending.otpAttempts || 0) + 1;
          stateObj.save();
          const remaining = Math.max(0, 5 - pending.otpAttempts);
          showToast(`Invalid verification code. Please check your email inbox. (${remaining} attempts left)`, 'error');
          this.render();
        }
      },

      // -------------------------------------------------------------
      // 4. EXPLORE & RESOURCE DETAIL / REQUEST

      getExploreHtml() {
        const user = stateObj.currentUser;
        const physical = stateObj.resources.filter(r => r.type === 'Physical Item');

        // Apply Tab Filter (All, Rent, Sell, Exchange)
        let filtered = physical;
        if (this.exploreTab === 'rent') {
          filtered = filtered.filter(r => r.listingMethod === 'rent' || !r.listingMethod);
        } else if (this.exploreTab === 'sell') {
          filtered = filtered.filter(r => r.listingMethod === 'sell');
        } else if (this.exploreTab === 'exchange') {
          filtered = filtered.filter(r => r.listingMethod === 'exchange');
        }

        // Apply Category Filter (Calculators, Drafters, Books, etc.)
        if (this.categoryFilter && this.categoryFilter !== 'all') {
          const cf = this.categoryFilter.toLowerCase();
          filtered = filtered.filter(r => {
            const cat = (r.category || '').toLowerCase();
            const nm = (r.name || '').toLowerCase();
            if (cf === 'calculators') return cat.includes('calc') || nm.includes('calc') || nm.includes('casio');
            if (cf === 'drafters') return cat.includes('draft') || nm.includes('draft') || nm.includes('scale');
            if (cf === 'books') return cat.includes('book') || nm.includes('mechanics') || nm.includes('signals') || nm.includes('processing') || nm.includes('textbook');
            return cat.includes(cf) || nm.includes(cf);
          });
        }

        // Apply Search Query Filter
        if (this.searchQuery && this.searchQuery.trim() !== '') {
          const q = this.searchQuery.toLowerCase().trim();
          filtered = filtered.filter(r => 
            (r.name && r.name.toLowerCase().includes(q)) ||
            (r.description && r.description.toLowerCase().includes(q)) ||
            (r.category && r.category.toLowerCase().includes(q)) ||
            (r.ownerName && r.ownerName.toLowerCase().includes(q)) ||
            (r.swapPreferences && r.swapPreferences.toLowerCase().includes(q))
          );
        }

        return `
          <div class="space-y-6 text-left">
            
            <!-- 1. FLIPKART-STYLE TOP SEARCH & LOCATION HEADER -->
            <div class="p-4 sm:p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 shadow-sm flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">

                  id="campus-search-input" 
                  value="${this.searchQuery || ''}" 
                  oninput="App.handleSearchInput(this.value)" 
                  placeholder="Search for textbooks, drafters, scientific calculators, revision notes..." 
                  class="w-full pl-12 pr-10 py-3 rounded-2xl bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 text-xs sm:text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all font-sans"
                >
                ${this.searchQuery ? `
                  <button onclick="App.handleSearchInput('');" class="absolute right-3.5 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 cursor-pointer">
                    <i data-lucide="x" class="w-4 h-4"></i>
                  </button>

                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>Share Resource</span>
                </button>
              </div>
            </div>

            <!-- 2. FLIPKART-STYLE HORIZONTAL CATEGORY ICON STRIP -->

              <div class="flex items-center gap-2 sm:gap-3 min-w-max pb-0.5">
                
                <!-- Category 1: All Items -->
                <button onclick="App.setCategoryFilter('all'); App.setExploreTab('all');" class="px-4 py-2.5 rounded-2xl text-xs font-bold transition-all flex items-center gap-2 cursor-pointer ${

      submitBorrowRequest(itemId) {
        const user = stateObj.currentUser;
        const item = stateObj.resources.find(r => r.id === itemId);
        if (!item) return;

        const listingMethod = item.listingMethod || 'rent';
        const reqQtyInput = document.getElementById('req-quantity');
        const quantity = reqQtyInput ? Math.max(1, parseInt(reqQtyInput.value) || 1) : 1;
        const purpose = document.getElementById('req-purpose')?.value.trim() || 'Lending Proposal';

        let newTx = {
          id: 'tx_' + Date.now().toString(36) + Math.random().toString(36).substring(7),
          resourceId: item.id,
          resourceName: item.name,
          borrowerId: user.id,
          borrowerName: user.name,
          ownerId: item.ownerId,
          ownerName: item.ownerName,
          quantity: quantity,
          txType: listingMethod,
          price: item.price || 0,
          paymentStatus: 'Pending',
          actualReturnDate: null,
          purpose: purpose,
          initialCondition: item.condition,
          initialPhotos: item.image ? [item.image] : [],
          returnCondition: '',
          returnPhotos: [],
          status: 'Pending Request',
          deductionReason: '',
          deductionAmount: 0,
          remainingDeposit: 0,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };

        if (listingMethod === 'rent') {
          const returnDateVal = document.getElementById('req-return-date').value;
          if (!returnDateVal) {
            showToast('Please select a proposed return date.', 'error');
            return;
          }
          newTx.expectedReturnDate = returnDateVal;
          newTx.borrowDate = new Date().toISOString().split('T')[0];
          newTx.itemValue = item.itemValue || 1000;
          newTx.securityDeposit = Math.round((item.itemValue || 1000) * 0.35 * quantity);
          newTx.depositRequired = true;
          newTx.depositStatus = 'Pending';
          
          const diffTime = Math.abs(new Date(returnDateVal) - new Date());
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) || 1;
          newTx.rentalDays = diffDays;
        } else if (listingMethod === 'sell') {
          newTx.expectedReturnDate = new Date().toISOString().split('T')[0];
          newTx.itemValue = item.price || 0;
          newTx.securityDeposit = 0;
          newTx.depositRequired = false;
          newTx.depositStatus = 'N/A';
        } else if (listingMethod === 'exchange') {
          const swapSelect = document.getElementById('req-swap-item');
          if (!swapSelect || !swapSelect.value) {
            showToast('You must select an item of your own to propose for exchange.', 'error');
            return;
          }
          newTx.swapResourceId = swapSelect.value;
          newTx.expectedReturnDate = new Date().toISOString().split('T')[0];
          newTx.itemValue = item.itemValue || 1000;
          newTx.securityDeposit = 0;
          newTx.depositRequired = false;
          newTx.depositStatus = 'N/A';
          newTx.paymentStatus = 'N/A';
        }

        stateObj.transactions.unshift(newTx);

        // Notifications & automatic messages
        stateObj.notifications.unshift({
          id: 'n_' + Date.now().toString(36),
          userId: item.ownerId,
          content: `📬 New ${listingMethod.toUpperCase()} Request: ${user.name} requested "${item.name}".`,
          type: 'request_received',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.messages.push({
          id: 'msg_auto_' + Date.now().toString(36),
          senderId: user.id,
          receiverId: item.ownerId,
          content: `Hi ${item.ownerName}, I have proposed a ${listingMethod} request for your item "${item.name}". Please check your dashboard!`,
          timestamp: new Date().toISOString()
        });

        stateObj.save();
        this.closeModal();
        showToast('Request sent successfully!');
        this.navigateTo('my_borrowings');
      },

      async acceptBorrowRequest(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        const txType = tx.txType || 'rent';

        if (txType === 'rent') {
          const depositInput = document.getElementById(`deposit-input-${txId}`);
          const returnDateInput = document.getElementById(`return-date-${txId}`);
          const photosInput = document.getElementById(`initial-photos-${txId}`);

          const depositAmount = depositInput ? parseInt(depositInput.value) || 0 : 0;
          const returnDate = returnDateInput ? returnDateInput.value : tx.expectedReturnDate;

          let initialPhotoBase64 = tx.initialPhotos || [];
          if (photosInput && photosInput.files[0]) {
            const b64 = await new Promise(resolve => {
              const reader = new FileReader();
              reader.onloadend = () => resolve(reader.result);
              reader.readAsDataURL(photosInput.files[0]);
            });
            initialPhotoBase64 = [b64];
          }

          tx.securityDeposit = depositAmount;
          tx.depositRequired = depositAmount > 0;
          tx.expectedReturnDate = returnDate;
          tx.initialPhotos = initialPhotoBase64;
          tx.depositStatus = 'Pending';
        }

        tx.status = 'Accepted';
        tx.updatedAt = new Date().toISOString();

        stateObj.notifications.unshift({
          id: 'n_acc_' + Date.now().toString(36),
          userId: tx.borrowerId,
          content: `✅ Proposal approved for "${tx.resourceName}". Please confirm the agreement and make necessary payments.`,
          type: 'agreement_pending',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        showToast('Proposal approved! Partner notified.');
        this.render();
      },

      rejectBorrowRequest(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        tx.status = 'Cancelled';
        tx.updatedAt = new Date().toISOString();

        const item = stateObj.resources.find(r => r.id === tx.resourceId);
        if (item) item.availability = 'available';

        stateObj.notifications.unshift({
          id: 'n_rej_' + Date.now().toString(36),
          userId: tx.borrowerId,
          content: `❌ Proposal declined for "${tx.resourceName}".`,
          type: 'request_declined',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        showToast('Request declined.');
        this.render();
      },

      ownerConfirmHandover(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        if (tx.txType === 'sell') {
          tx.status = 'Returned'; // closed transaction
          tx.actualReturnDate = new Date().toISOString().split('T')[0];
          
          // Transfer ownership of 1 unit of stock
          const item = stateObj.resources.find(r => r.id === tx.resourceId);
          if (item) {
            item.availableQuantity = Math.max(0, (item.availableQuantity || 1) - tx.quantity);
            if (item.availableQuantity === 0) item.availability = 'borrowed';
          }
          
          stateObj.notifications.unshift({
            id: 'n_sell_comp_' + Date.now().toString(36),
            userId: tx.borrowerId,
            content: `🎁 Sale completed! Handover of "${tx.resourceName}" confirmed by owner.`,
            type: 'sale_completed',
            createdAt: new Date().toISOString(),
            isRead: false
          });
          
          showToast('Sale completed! Handover confirmed.');
        } else {
          tx.status = 'Active Borrow';
          
          // Deduct from resource stock
          const item = stateObj.resources.find(r => r.id === tx.resourceId);
          if (item) {
            item.availableQuantity = Math.max(0, (item.availableQuantity || 1) - tx.quantity);
            if (item.availableQuantity === 0) item.availability = 'borrowed';
          }
          
          stateObj.notifications.unshift({
            id: 'n_rent_act_' + Date.now().toString(36),
            userId: tx.borrowerId,
            content: `🔑 Handover confirmed! Your rental for "${tx.resourceName}" is now active.`,
            type: 'rent_active',
            createdAt: new Date().toISOString(),
            isRead: false
          });
          
          showToast('Rental activated!');
        }

        tx.updatedAt = new Date().toISOString();
        stateObj.save();
        this.render();
      },

      confirmExchangeHandover(txId, party) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        if (party === 'owner') {
          tx.ownerHandedOver = true;
        } else {
          tx.borrowerHandedOver = true;
        }

        if (tx.ownerHandedOver && tx.borrowerHandedOver) {
          tx.status = 'Returned'; // Completed Swap
          tx.actualReturnDate = new Date().toISOString().split('T')[0];
          
          // Swapping item logic
          const mainItem = stateObj.resources.find(r => r.id === tx.resourceId);
          const swapItem = stateObj.resources.find(r => r.id === tx.swapResourceId);

          if (mainItem) {
            mainItem.availableQuantity = Math.max(0, (mainItem.availableQuantity || 1) - 1);
            if (mainItem.availableQuantity === 0) mainItem.availability = 'borrowed';
          }
          if (swapItem) {
            swapItem.availableQuantity = Math.max(0, (swapItem.availableQuantity || 1) - 1);
            if (swapItem.availableQuantity === 0) swapItem.availability = 'borrowed';
          }

          stateObj.notifications.unshift({
            id: 'n_sw_co_o_' + Date.now().toString(36),
            userId: tx.ownerId,
            content: `🔄 Swap completed successfully for "${tx.resourceName}"!`,
            type: 'exchange_completed',
            createdAt: new Date().toISOString(),
            isRead: false
          });

          stateObj.notifications.unshift({
            id: 'n_sw_co_b_' + Date.now().toString(36),
            userId: tx.borrowerId,
            content: `🔄 Swap completed successfully for "${tx.resourceName}"!`,
            type: 'exchange_completed',
            createdAt: new Date().toISOString(),
            isRead: false
          });

          showToast('Swap complete! Both handovers verified.');
        } else {
          showToast('Handover confirmed! Awaiting confirmation from partner.');
        }

        tx.updatedAt = new Date().toISOString();
        stateObj.save();
        this.render();
      },

      async confirmReturnAndRelease(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        const photoInput = document.getElementById(`return-photos-${txId}`);
        let returnPhotos = [];
        if (photoInput && photoInput.files[0]) {
          const b64 = await new Promise(resolve => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(photoInput.files[0]);
          });
          returnPhotos = [b64];
        }

        tx.status = 'Returned';
        tx.depositStatus = 'Released';
        tx.actualReturnDate = new Date().toISOString().split('T')[0];
        tx.returnPhotos = returnPhotos;
        tx.updatedAt = new Date().toISOString();

        const res = stateObj.resources.find(r => r.id === tx.resourceId);
        if (res) {
          const returnedQty = tx.quantity || 1;
          const totalQty = res.quantity || 1;
          const currentAvail = res.availableQuantity !== undefined ? res.availableQuantity : 0;
          res.availableQuantity = Math.min(totalQty, currentAvail + returnedQty);
          if (res.availableQuantity > 0) {
            res.availability = 'available';
          }
        }

        const borrower = stateObj.users.find(u => u.id === tx.borrowerId);
        if (borrower) {
          borrower.trustScore = Math.min(100, borrower.trustScore + 5);
        }

        stateObj.notifications.unshift({
          id: 'n_ret_rel_' + Date.now().toString(36),
          userId: tx.borrowerId,
          content: `🎉 Return Confirmed! Owner verified condition of "${tx.resourceName}". Security Deposit of ₹${tx.securityDeposit || 0} is Released. Trust Score +5!`,
          type: 'deposit_released',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        showToast('Return confirmed and security deposit released!');
        this.render();
      },

      submitDeductionProposal(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        const reason = document.getElementById('deduction-reason').value.trim();
        const amount = parseInt(document.getElementById('deduction-amount').value) || 0;

        if (!reason || amount <= 0) {
          showToast('Please provide a deduction reason and positive amount.', 'error');
          return;
        }

        if (amount > (tx.securityDeposit || 0)) {
          showToast(`Deduction cannot exceed deposit amount (₹${tx.securityDeposit}).`, 'error');
          return;
        }

        tx.deductionReason = reason;
        tx.deductionAmount = amount;
        tx.remainingDeposit = (tx.securityDeposit || 0) - amount;
        tx.depositStatus = amount === tx.securityDeposit ? 'Fully Deducted' : 'Partially Deducted';
        tx.updatedAt = new Date().toISOString();

        stateObj.notifications.unshift({
          id: 'n_ded_prop_' + Date.now().toString(36),
          userId: tx.borrowerId,
          content: `⚠️ Deposit Deduction Notice: Owner proposed ₹${amount} deduction for "${tx.resourceName}". Reason: "${reason}". Please review to accept or dispute.`,
          type: 'deduction_proposal',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        this.closeModal();
        showToast('Deduction proposal submitted to borrower.');
        this.render();
      },

        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        tx.status = 'Returned';
        tx.actualReturnDate = new Date().toISOString().split('T')[0];
        tx.updatedAt = new Date().toISOString();

        const res = stateObj.resources.find(r => r.id === tx.resourceId);
        if (res) res.availability = 'available';

        const borrower = stateObj.users.find(u => u.id === tx.borrowerId);
        if (borrower) {

          type: 'deduction_accepted',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        showToast('Deduction accepted. Transaction closed.');
        this.render();

        const saleContainer = document.getElementById('sale-price-container');
        const swapContainer = document.getElementById('swap-preferences-container');
        const durationContainer = document.getElementById('lending-duration-container');

          if (durationContainer) durationContainer.style.display = 'block';

          if (swapContainer) swapContainer.style.display = 'none';
          if (durationContainer) durationContainer.style.display = 'none';

          if (swapContainer) swapContainer.style.display = 'block';
          if (durationContainer) durationContainer.style.display = 'none';

      async handleShareSubmit() {
        const name = document.getElementById('share-name').value.trim();
        const category = document.getElementById('share-cat').value;
        const type = document.getElementById('share-type').value;
        const desc = document.getElementById('share-desc').value.trim();
        const photoFile = document.getElementById('share-photo-file').files[0];
        const itemValInput = document.getElementById('share-item-value');
        const itemValue = itemValInput ? (parseInt(itemValInput.value) || 1000) : 1000;
        const qtyInput = document.getElementById('share-quantity');
        const quantity = (type === 'Physical Item' && qtyInput) ? Math.max(1, parseInt(qtyInput.value) || 1) : 1;

        if (!name || !desc) {
          showToast('Please fill all required inputs.', 'error');
          return;
        }

        let base64Photo = '';
        if (photoFile) {
          base64Photo = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(photoFile);
          });
        }

        const user = stateObj.currentUser;
        const cond = type === 'Digital Resource' ? 'New' : document.getElementById('share-condition').value;
        const dur = type === 'Digital Resource' ? 0 : parseInt(document.getElementById('share-duration').value);

        // EXTRA FIELDS FOR THE 3 METHODS
        const method = type === 'Digital Resource' ? 'rent' : document.getElementById('share-method').value;
        const priceInput = document.getElementById('share-price');
        const price = (type === 'Physical Item' && method === 'sell' && priceInput) ? (parseInt(priceInput.value) || 0) : 0;
        const swapInput = document.getElementById('share-swap-pref');
        const swapPreferences = (type === 'Physical Item' && method === 'exchange' && swapInput) ? swapInput.value.trim() : '';

        const newResource = {
          id: 'r_' + Date.now().toString(36),
          ownerId: user.id,
          ownerName: user.name,
          name,
          category,
          description: desc,
          type,
          condition: cond,
          itemValue: itemValue,
          quantity: quantity,
          availableQuantity: quantity,
          availability: 'available',
          lendingDuration: dur,
          listingMethod: method,
          price: price,
          swapPreferences: swapPreferences,
          location: type === 'Digital Resource' ? 'Online' : 'Hostel / Campus Lobby',
          image: base64Photo,
          ratingAverage: 0
        };

        // Try API Backend first
        try {
          await fetch('http://localhost:5000/api/resources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ownerId: user.id,
              ownerName: user.name,
              name,
              category,
              description: desc,
              type,
              condition: cond,
              itemValue: itemValue,
              quantity: quantity,
              lendingDuration: dur,
              listingMethod: method,
              price: price,
              swapPreferences: swapPreferences,
              location: type === 'Digital Resource' ? 'Online' : 'Hostel / Campus Lobby',
              image: base64Photo
            })
          });
        } catch(e) {}

        stateObj.resources.unshift(newResource);
        stateObj.save();
        showToast('Resource added successfully!');
        if (type === 'Digital Resource') {
          this.navigateTo('study_materials');

      handleStudyPdfSelected(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        if (!file.name.toLowerCase().endsWith('.pdf') && file.type !== 'application/pdf') {
          showToast('Please select a valid PDF file (.pdf)', 'error');
          return;
        }

        if (file.size > 8 * 1024 * 1024) {
          showToast('PDF file size must be under 8MB.', 'error');
          return;
        }

        let sizeStr = '';
        if (file.size > 1024 * 1024) {
          sizeStr = (file.size / (1024 * 1024)).toFixed(1) + ' MB';
        } else {
          sizeStr = Math.round(file.size / 1024) + ' KB';
        }

        this.selectedPdfFileName = file.name;
        this.selectedPdfFileSize = sizeStr;

        const titleInput = document.getElementById('upload-doc-title');
        if (titleInput && !titleInput.value.trim()) {
          titleInput.value = file.name.replace(/\.pdf$/i, '').replace(/[-_]/g, ' ');
        }

        const dropzoneContent = document.getElementById('pdf-dropzone-content');
        if (dropzoneContent) {
          dropzoneContent.innerHTML = `
            <div class="p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-between text-xs">
              <div class="flex items-center gap-2 truncate">
                <i data-lucide="file-check" class="w-5 h-5 text-emerald-500 shrink-0"></i>
                <div class="truncate text-left">
                  <div class="font-bold truncate">${file.name}</div>
                  <div class="text-[10px] text-slate-400">${sizeStr} • PDF Ready to Upload</div>
                </div>
              </div>
              <span class="text-[10px] text-blue-600 underline font-bold shrink-0 ml-2">Change File</span>
            </div>
          `;
          if (window.lucide) window.lucide.createIcons();
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          this.selectedPdfBase64 = e.target.result;
        };
        reader.onerror = () => {
          showToast('Failed to read PDF file.', 'error');
        };
        reader.readAsDataURL(file);
      },

      submitUploadPdf() {
        const user = stateObj.currentUser;
        if (!user) return;

        if (!this.selectedPdfBase64) {
          showToast('Please select a PDF file to upload.', 'error');
          return;
        }

        const titleInput = document.getElementById('upload-doc-title');
        const title = titleInput ? titleInput.value.trim() : '';
        if (!title) {
          showToast('Please enter a document title.', 'error');
          return;
        }

        const folderSelect = document.getElementById('upload-target-folder');
        let folderId = folderSelect ? folderSelect.value : 'auto_generate';
        let folderName = '';

        if (folderId === 'auto_generate') {
          const customNameInput = document.getElementById('upload-custom-folder-name');
          folderName = customNameInput && customNameInput.value.trim() ? customNameInput.value.trim() : (user.name + "'s Study Vault");
          const newFolder = {
            id: 'f_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(7),
            name: folderName,
            subject: document.getElementById('upload-doc-subject')?.value.trim() || 'Academic Notes',
            description: 'Personal study folder for ' + user.name,
            ownerId: user.id,
            ownerName: user.name,
            ownerZprn: user.zprn || 'Verified',
            createdAt: new Date().toISOString()
          };
          stateObj.studyFolders.unshift(newFolder);
          folderId = newFolder.id;
        } else {
          const existing = stateObj.studyFolders.find(f => f.id === folderId);
          if (existing && existing.ownerId !== user.id) {
            showToast('You can only upload PDFs to your own study folder.', 'error');
            return;
          }
          folderName = existing ? existing.name : (user.name + "'s Study Vault");
        }

        const subject = document.getElementById('upload-doc-subject')?.value.trim() || 'General';
        const semester = document.getElementById('upload-doc-sem')?.value || 'Semester 3';
        const description = document.getElementById('upload-doc-desc')?.value.trim() || '';

        const newDoc = {
          id: 'doc_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(7),
          folderId: folderId,
          folderName: folderName,
          ownerId: user.id,
          ownerName: user.name,
          title: title,
          subject: subject,
          semester: semester,
          fileName: this.selectedPdfFileName || (title + '.pdf'),
          fileSize: this.selectedPdfFileSize || '1.0 MB',
          fileData: this.selectedPdfBase64,
          description: description,
          uploadDate: new Date().toISOString(),
          downloads: 0
        };

        stateObj.studyMaterials.unshift(newDoc);
        try {
          stateObj.save();
        } catch (err) {
          stateObj.studyMaterials.shift();
          showToast('Storage quota exceeded. Please upload a smaller PDF file.', 'error');
          return;
        }

        this.closeModal();
        showToast(`PDF "${title}" successfully stored in your folder!`, 'success');
        this.activeStudyFolderId = folderId;
        this.render();
      },

      downloadStudyPdf(materialId) {
        const mat = stateObj.studyMaterials.find(m => m.id === materialId);
        if (!mat || !mat.fileData) {
          showToast('File data not available for download.', 'error');
          return;
        }
        const a = document.createElement('a');
        a.href = mat.fileData;
        a.download = mat.fileName || (mat.title + '.pdf');
        document.body.appendChild(a);
        a.click();
        a.remove();
        mat.downloads = (mat.downloads || 0) + 1;
        stateObj.save();
        showToast(`Downloading "${mat.fileName || mat.title}"...`, 'success');
      },

      deleteStudyPdf(materialId) {
        const user = stateObj.currentUser;
        const mat = stateObj.studyMaterials.find(m => m.id === materialId);
        if (!mat) return;
        if (!user || user.id !== mat.ownerId) {
          showToast('You can only delete files you uploaded to your folder.', 'error');
          return;
        }
        if (!confirm(`Are you sure you want to delete "${mat.title}"?`)) return;
        stateObj.studyMaterials = stateObj.studyMaterials.filter(m => m.id !== materialId);
        stateObj.save();
        showToast(`Document "${mat.title}" deleted.`);
        this.render();
      },

      deleteStudyFolder(folderId) {
        const user = stateObj.currentUser;
        const folder = stateObj.studyFolders.find(f => f.id === folderId);
        if (!folder) return;
        if (!user || user.id !== folder.ownerId) {
          showToast('You can only delete your own folder.', 'error');
          return;
        }
        if (!confirm(`Are you sure you want to delete folder "${folder.name}" and all PDFs inside it?`)) return;
        stateObj.studyFolders = stateObj.studyFolders.filter(f => f.id !== folderId);
        stateObj.studyMaterials = stateObj.studyMaterials.filter(m => m.folderId !== folderId);
        stateObj.save();
        this.activeStudyFolderId = null;
        showToast(`Folder "${folder.name}" deleted.`);
        this.render();
      },

      getStudyMaterialsHtml() {
        const user = stateObj.currentUser;
        const folders = stateObj.studyFolders || [];
        const materials = stateObj.studyMaterials || [];

        // If inside a specific folder
        if (this.activeStudyFolderId) {
          const folder = folders.find(f => f.id === this.activeStudyFolderId);
          if (!folder) {
            this.activeStudyFolderId = null;
            return this.getStudyMaterialsHtml();
          }

          const folderPdfs = materials.filter(m => m.folderId === folder.id);
          const isOwner = user && user.id === folder.ownerId;
