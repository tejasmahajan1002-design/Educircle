<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShare - Resource Sharing, Security Deposit & Trust Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.45);
    }
    .dark .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .hover-lift {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hover-lift:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 12px 30px rgba(99, 102, 241, 0.16);
    }
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }
    .otp-input {
      letter-spacing: 12px;
      font-size: 28px;
      font-weight: 800;
      text-align: center;
    }
  </style>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#edd8ff',
              200: '#d9b6ff',
              300: '#c58eff',
              400: '#b15cff',
              500: '#9d24ff',
              600: '#7e22ce', // Rich purple accent
              700: '#6b21a8',
              800: '#581c87',
              900: '#4c1d95',
              950: '#2e1065',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

  <!-- Core App Layout Grid -->
  <div id="app-root" class="min-h-screen flex flex-col">
    <!-- Screen contents will render here dynamically -->
  </div>

  <!-- Modal Container for Agreements, Photo Inspections, Disputes, and Custom Actions -->
  <div id="modal-root" class="relative z-50"></div>

  <!-- Standalone Application Logic -->
  <script>
    const INITIAL_USERS = [
      { id: 'u_admin', name: 'Campus Administrator', email: 'admin@campushare.edu', mobileNumber: '9999999999', rollNumber: 'ADMIN01', department: 'Administration', year: 'N/A', semester: 'N/A', password: 'admin123', role: 'admin', trustScore: 100, ratingAverage: 5.0, status: 'active', emailVerified: true }
    ];

    // Helper SHA-256 Hasher for Client-Side Security Simulation
    async function hashString(str) {
      const buffer = new TextEncoder().encode(str + "_salt_campushare_2026");
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    class CampusShareState {
      constructor() {
        this.load();
        this.checkOverdueAndReminders();
      }

      load() {
        const cached = localStorage.getItem('campushare_state_v4');
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            this.currentUser = parsed.currentUser || null;
            this.users = parsed.users || INITIAL_USERS;
            this.resources = parsed.resources || [];
            this.transactions = parsed.transactions || [];
            this.notifications = parsed.notifications || [];
            this.messages = parsed.messages || [];
            this.reports = parsed.reports || [];
            this.lostAndFound = parsed.lostAndFound || [];
            this.borrowRequests = parsed.borrowRequests || [];
            this.exchangeRequests = parsed.exchangeRequests || [];
            this.ratings = parsed.ratings || [];
            this.pendingRegistrations = parsed.pendingRegistrations || [];
          } catch(e) {
            this.resetToInitial();
          }
        } else {
          this.resetToInitial();
        }
      }

      resetToInitial() {
        this.currentUser = null;
        this.users = INITIAL_USERS;
        this.resources = [];
        this.transactions = [];
        this.notifications = [];
        this.messages = [];
        this.reports = [];
        this.lostAndFound = [];
        this.borrowRequests = [];
        this.exchangeRequests = [];
        this.ratings = [];
        this.pendingRegistrations = [];
        this.save();
      }

      save() {
        localStorage.setItem('campushare_state_v4', JSON.stringify({
          currentUser: this.currentUser,
          users: this.users,
          resources: this.resources,
          transactions: this.transactions,
          notifications: this.notifications,
          messages: this.messages,
          reports: this.reports,
          lostAndFound: this.lostAndFound,
          borrowRequests: this.borrowRequests,
          exchangeRequests: this.exchangeRequests,
          ratings: this.ratings,
          pendingRegistrations: this.pendingRegistrations
        }));
      }

      checkOverdueAndReminders() {
        const now = new Date();
        let changed = false;

        this.transactions.forEach(tx => {
          if (tx.status === 'Active Borrow' || tx.status === 'Return Requested') {
            const dueDate = new Date(tx.expectedReturnDate);
            const diffHours = (dueDate - now) / (1000 * 60 * 60);

            if (diffHours < 0 && tx.status !== 'Overdue') {
              tx.status = 'Overdue';
              changed = true;

              const borrower = this.users.find(u => u.id === tx.borrowerId);
              if (borrower && borrower.trustScore > 20) {
                borrower.trustScore = Math.max(20, borrower.trustScore - 10);
              }

              this.notifications.unshift({
                id: 'n_ovd_' + Date.now() + Math.random().toString(36).substring(7),
                userId: tx.borrowerId,
                content: `⚠️ OVERDUE WARNING: Your borrowed item "${tx.resourceName}" is past its return date (${dueDate.toLocaleDateString()}). Return it immediately to avoid further trust penalties.`,
                type: 'overdue_alert',
                createdAt: new Date().toISOString(),
                isRead: false
              });

              this.notifications.unshift({
                id: 'n_ovd_own_' + Date.now() + Math.random().toString(36).substring(7),
                userId: tx.ownerId,
                content: `⚠️ OVERDUE NOTICE: "${tx.resourceName}" borrowed by ${tx.borrowerName} is now overdue. You can contact them or propose deduction.`,
                type: 'overdue_alert',
                createdAt: new Date().toISOString(),
                isRead: false
              });

              this.notifications.unshift({
                id: 'n_ovd_adm_' + Date.now() + Math.random().toString(36).substring(7),
                userId: 'u_admin',
                content: `OVERDUE TRANSACTION: ${tx.borrowerName} has not returned "${tx.resourceName}" to ${tx.ownerName}.`,
                type: 'admin_alert',
                createdAt: new Date().toISOString(),
                isRead: false
              });
            }
          }
        });

        if (changed) {
          this.save();
        }
      }
    }

    const stateObj = new CampusShareState();

    function getTrustLevel(user) {
      if (!user) return { level: 'Good', badgeClass: 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/20' };
      
      const hasOverdueOrDispute = stateObj.transactions.some(t => 
        t.borrowerId === user.id && (t.status === 'Overdue' || t.status === 'Disputed')
      );

      if (hasOverdueOrDispute || user.trustScore < 50 || user.status === 'blocked') {
        return { level: 'Restricted', badgeClass: 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/20' };
      }
      if (user.trustScore >= 90) {
        return { level: 'Excellent', badgeClass: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20' };
      }
      if (user.trustScore >= 75) {
        return { level: 'Good', badgeClass: 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/20' };
      }
      return { level: 'Average', badgeClass: 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/20' };
    }

    function showToast(msg, type = 'success') {
      const existing = document.getElementById('global-toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.id = 'global-toast';
      toast.className = `fixed bottom-6 right-6 z-[9999] flex items-center p-4 rounded-2xl shadow-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 transition-all duration-300 animate-bounce`;
      
      const indicatorColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-rose-500' : 'bg-brand-500';
      toast.innerHTML = `
        <div class="mr-3 w-3 h-3 rounded-full ${indicatorColor} flex-shrink-0"></div>
        <p class="text-xs font-bold text-slate-800 dark:text-slate-200">${msg}</p>
      `;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    // App core router & controller
    window.App = {
      currentView: 'home',
      viewParams: {},
      theme: localStorage.getItem('theme') || 'light',
      showNotifsDropdown: false,
      resendTimerInterval: null,
      resendCountdown: 0,
      exploreTab: 'all',

      init() {
        if (this.theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        stateObj.checkOverdueAndReminders();
        this.render();
      },

      toggleTheme() {
        this.theme = this.theme === 'light' ? 'dark' : 'light';
        localStorage.setItem('theme', this.theme);
        if (this.theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        this.render();
      },

      navigateTo(view, params = {}) {
        this.showNotifsDropdown = false;
        if (this.resendTimerInterval) {
          clearInterval(this.resendTimerInterval);
          this.resendTimerInterval = null;
        }
        this.currentView = view;
        this.viewParams = params;
        this.closeModal();
        stateObj.checkOverdueAndReminders();
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if (view === 'verify_email') {
          this.startResendTimer(60);
        }
      },

      logout() {
        stateObj.currentUser = null;
        stateObj.save();
        showToast('Logged out successfully.');
        this.navigateTo('home');
      },

      openModal(htmlContent) {
        const root = document.getElementById('modal-root');
        root.innerHTML = `
          <div class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in" onclick="if(event.target === this) App.closeModal()">
            <div class="glass-panel bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 text-left relative">
              <button onclick="App.closeModal()" class="absolute top-5 right-5 p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
              ${htmlContent}
            </div>
          </div>
        `;
        lucide.createIcons();
      },

      closeModal() {
        const root = document.getElementById('modal-root');
        if (root) root.innerHTML = '';
      },

      render() {
        const root = document.getElementById('app-root');
        root.innerHTML = '';

        const user = stateObj.currentUser;
        const navbarHtml = this.getNavbarHtml(user);
        
        if (!user && ['home', 'login', 'register', 'verify_email', 'forgot_password', 'reset_password'].includes(this.currentView)) {
          root.innerHTML = `
            ${navbarHtml}
            <div class="flex-1 pt-16 bg-[#f8fafc] dark:bg-slate-950 min-h-screen">
              ${this.getScreenHtml()}
            </div>
          `;
        } else {
          root.innerHTML = `
            ${navbarHtml}
            <div class="flex flex-1 min-h-screen bg-[#f8fafc] dark:bg-slate-950">
              ${this.getSidebarHtml(user)}
              <main class="flex-1 pt-24 lg:pl-64 px-6 pb-6 md:px-8 md:pb-8 max-w-7xl mx-auto w-full min-h-[calc(100vh-4rem)]">
                ${this.getScreenHtml()}
              </main>
            </div>
          `;
        }

        lucide.createIcons();
      },

      getNavbarHtml(user) {
        if (!user) {
          return `
            <header class="fixed top-0 inset-x-0 h-16 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md">
              <div class="flex items-center justify-between px-6 h-full max-w-7xl mx-auto">
                <div class="flex items-center gap-3 cursor-pointer" onclick="App.navigateTo('home')">
                  <div class="flex items-center justify-center w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-600 text-white font-bold text-lg shadow-md shadow-brand-500/25">C</div>
                  <div>
                    <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-800 dark:from-white dark:to-slate-200">CampusShare</span>
                    <span class="text-[9px] block text-brand-600 dark:text-brand-400 font-semibold tracking-wider uppercase">Deposit & Trust Hub</span>
                  </div>
                </div>
                
                <div class="flex items-center gap-3">
                  <button onclick="App.toggleTheme()" class="p-2 rounded-xl text-slate-600 hover:bg-slate-100 transition-colors">
                    ${this.theme === 'dark' ? '<i data-lucide="sun" class="w-5 h-5"></i>' : '<i data-lucide="moon" class="w-5 h-5"></i>'}
                  </button>
                  <button onclick="App.navigateTo('login')" class="text-sm font-semibold text-slate-600 hover:text-slate-900 mr-2">Login</button>
                  <button onclick="App.navigateTo('register')" class="px-4 py-2 text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-md shadow-brand-500/20 rounded-xl">Sign Up</button>
                </div>
              </div>
            </header>
          `;
        }

        const unreadCount = stateObj.notifications.filter(n => n.userId === user.id && !n.isRead).length;

        let viewTitle = 'Dashboard';
        if (this.currentView === 'explore') viewTitle = 'Explore Items';
        else if (this.currentView === 'study_materials') viewTitle = 'Study Materials';
        else if (this.currentView === 'share_resource') viewTitle = 'Upload New';
        else if (this.currentView === 'my_listings') viewTitle = 'My Shared Resources';
        else if (this.currentView === 'my_lendings') viewTitle = 'Lending Requests';
        else if (this.currentView === 'my_borrowings') viewTitle = 'My Borrowings';
        else if (this.currentView === 'messages') viewTitle = 'Messages';
        else if (this.currentView === 'lost_found') viewTitle = 'Lost & Found';
        else if (this.currentView === 'leaderboard') viewTitle = 'Leaderboard';
        else if (this.currentView === 'profile') viewTitle = 'Profile Settings';
        else if (this.currentView === 'admin') viewTitle = 'Admin Dashboard';

        return `
          <header class="fixed top-0 right-0 left-0 lg:left-64 h-16 z-30 border-b border-slate-200/80 dark:border-slate-800/85 bg-white dark:bg-slate-900 flex items-center justify-between px-8 shadow-sm">
            <h1 class="text-lg font-bold text-slate-800 dark:text-white">${viewTitle}</h1>
            
            <div class="flex items-center gap-6">
              <!-- Search simulation -->
              <div class="relative hidden md:block">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-2.5 text-slate-400"></i>
                <input type="text" placeholder="Search" class="pl-10 pr-4 py-1.5 w-52 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs text-slate-655 focus:outline-none focus:ring-1 focus:ring-slate-200">
              </div>

              <!-- Notifications dropdown -->
              <div class="relative">
                <button onclick="App.toggleNotifsDropdown(event)" class="relative p-2 rounded-xl text-slate-600 dark:text-slate-350 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                  <i data-lucide="bell" class="w-5 h-5"></i>
                  ${unreadCount > 0 ? `<span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-rose-500"></span>` : ''}
                </button>

                ${this.showNotifsDropdown ? `
                  <div class="absolute right-0 mt-2 w-80 max-h-96 overflow-y-auto rounded-2xl bg-white dark:bg-slate-900 border border-slate-250 dark:border-slate-800 shadow-2xl z-[999] text-left p-4">
                    <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-3">
                      <span class="text-xs font-bold text-slate-800 dark:text-slate-200">Notifications</span>
                      <button onclick="App.markAllNotifsRead(event)" class="text-[10px] font-semibold text-brand-500 hover:underline">Mark all read</button>
                    </div>
                    <div class="space-y-2">
                      ${this.getNotifsListHtml(user)}
                    </div>
                  </div>
                ` : ''}
              </div>

              <!-- Profile avatar card -->
              <div class="flex items-center gap-2.5 cursor-pointer" onclick="App.navigateTo('profile', {userId: '${user.id}'})">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand-655 to-indigo-500 flex items-center justify-center font-bold text-white text-xs">${user.name.charAt(0)}</div>
                <span class="text-xs font-bold text-slate-700 dark:text-slate-200 hidden sm:inline">${user.name}</span>
              </div>
            </div>
          </header>
        `;
      },

      toggleNotifsDropdown(e) {
        if (e) e.stopPropagation();
        this.showNotifsDropdown = !this.showNotifsDropdown;
        this.render();
      },

      markNotifRead(notifId) {
        const notif = stateObj.notifications.find(n => n.id === notifId);
        if (notif) {
          notif.isRead = true;
          stateObj.save();
          this.render();
        }
      },

      markAllNotifsRead(e) {
        if (e) e.stopPropagation();
        const user = stateObj.currentUser;
        if (user) {
          stateObj.notifications.filter(n => n.userId === user.id).forEach(n => n.isRead = true);
          stateObj.save();
          showToast('All notifications marked as read.');
          this.render();
        }
      },

      getNotifsListHtml(user) {
        const notifs = stateObj.notifications.filter(n => n.userId === user.id);
        if (notifs.length === 0) {
          return `<p class="text-[11px] text-slate-400 text-center py-6">No notifications yet.</p>`;
        }
        return notifs.map(n => `
          <div class="p-2.5 rounded-xl border border-slate-100 dark:border-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors text-xs flex justify-between gap-2 items-start cursor-pointer ${n.isRead ? 'opacity-60' : 'bg-brand-50/30 dark:bg-brand-950/30 border-brand-200/50'}" onclick="App.markNotifRead('${n.id}')">
            <div>
              <p class="text-[11px] text-slate-800 dark:text-slate-200 leading-snug">${n.content}</p>
              <span class="text-[9px] text-slate-400 mt-1 block">${new Date(n.createdAt).toLocaleString()}</span>
            </div>
            ${!n.isRead ? `<div class="w-2 h-2 rounded-full bg-brand-500 mt-1 flex-shrink-0"></div>` : ''}
          </div>
        `).join('');
      },

      getSidebarHtml(user) {
        if (!user) return '';
        const current = this.currentView;

        const incomingRequestsCount = stateObj.transactions.filter(t => t.ownerId === user.id && (t.status === 'Pending Request' || t.status === 'Return Requested')).length;
        const myBorrowActionsCount = stateObj.transactions.filter(t => t.borrowerId === user.id && (t.status === 'Accepted' || t.depositStatus === 'Partially Deducted' || t.depositStatus === 'Fully Deducted')).length;

        const links = [
          { name: 'Dashboard', view: 'dashboard', icon: 'layout-dashboard' },
          { name: 'My Shared Resources', view: 'my_listings', icon: 'folder' },
          { name: 'Upload New', view: 'share_resource', icon: 'upload-cloud' },
          { name: 'Explore Items', view: 'explore', icon: 'compass' },
          { name: 'Study Materials', view: 'study_materials', icon: 'file-text' },
          { name: 'Lending Requests', view: 'my_lendings', icon: 'hand-coins', badge: incomingRequestsCount },
          { name: 'My Borrowings', view: 'my_borrowings', icon: 'trending-up', badge: myBorrowActionsCount },
          { name: 'Messages', view: 'messages', icon: 'message-square' },
          { name: 'Lost & Found', view: 'lost_found', icon: 'shield-alert' },
          { name: 'Leaderboard', view: 'leaderboard', icon: 'award' }
        ];

        return `
          <aside class="fixed inset-y-0 left-0 z-20 hidden lg:flex flex-col w-64 bg-[#0b1329] border-r border-slate-850 text-slate-400">
            <!-- Brand Header -->
            <div class="flex items-center gap-3 px-6 py-5 border-b border-slate-850">
              <div class="flex items-center justify-center w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-500 to-indigo-500 text-white font-bold text-base shadow-lg">
                <i data-lucide="layers" class="w-4 h-4 text-white"></i>
              </div>
              <span class="text-base font-bold text-white tracking-wide">ResourceHub</span>
            </div>

            <!-- Nav Links -->
            <nav class="flex-1 px-4 py-4 space-y-1.5 overflow-y-auto text-left">
              ${links.map(l => `
                <button onclick="App.navigateTo('${l.view}')" class="flex items-center justify-between w-full px-4 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                  current === l.view ? 'bg-white/10 text-white font-bold' : 'text-slate-400 hover:text-white hover:bg-white/5'
                }">
                  <div class="flex items-center gap-3">
                    <i data-lucide="${l.icon}" class="w-4 h-4"></i>
                    <span>${l.name}</span>
                  </div>
                  ${l.badge > 0 ? `<span class="px-1.5 py-0.2 rounded-full bg-rose-500 text-white text-[9px] font-bold">${l.badge}</span>` : ''}
                </button>
              `).join('')}

              ${user.role === 'admin' ? `
                <button onclick="App.navigateTo('admin')" class="flex items-center gap-3 w-full px-4 py-2.5 rounded-xl text-xs font-bold text-rose-400 hover:bg-rose-500/10 transition-all border border-rose-500/20 mt-4 ${
                  current === 'admin' ? 'bg-rose-600 text-white' : ''
                }">
                  <i data-lucide="shield-alert" class="w-4 h-4"></i>
                  <span>Admin Dashboard</span>
                </button>
              ` : ''}
            </nav>

            <!-- Bottom utility items -->
            <div class="p-4 border-t border-slate-850 space-y-1">
              <button onclick="App.navigateTo('profile', {userId: '${user.id}'})" class="flex items-center gap-3 w-full px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition-all">
                <i data-lucide="settings" class="w-4 h-4"></i>
                <span>Settings</span>

      async handleLoginSubmit() {
        const email = document.getElementById('login-email').value.trim().toLowerCase();

        if (!email || !pass) {
          showToast('Please fill in email and password.', 'error');
          return;

        // Check if unverified registration exists
        const pending = stateObj.pendingRegistrations.find(p => p.email === email);
        if (pending) {
          showToast('Your email is not verified yet. Please enter the OTP code.', 'error');
          this.navigateTo('verify_email', { email });
          return;
        }

        const match = stateObj.users.find(u => u.email.toLowerCase() === email);
        if (!match) {
          showToast('No verified account found with this email.', 'error');
          return;
        }

        if (match.status === 'blocked') {
          showToast('Your account is blocked by administrative moderation.', 'error');
          return;
        }

        if (match.role === 'student' && !match.emailVerified) {
          showToast('Please complete email verification before logging in.', 'error');
          this.navigateTo('verify_email', { email });
          return;
        }

        const isCorrectPassword = (match.role === 'admin' && pass === 'admin123') || (match.role === 'student' && pass === match.password);
        if (!isCorrectPassword) {
          showToast('Incorrect password.', 'error');
          return;
        }

        stateObj.currentUser = match;
        stateObj.save();
        showToast(`Welcome back, ${match.name}!`);
        this.navigateTo('dashboard');

      async handleRegisterSubmit() {
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim().toLowerCase();
        const mobile = document.getElementById('reg-mobile').value.trim();
        const roll = 'N/A';
        const dept = document.getElementById('reg-dept').value;
        const year = document.getElementById('reg-year').value;
        const sem = document.getElementById('reg-sem').value;
        const pass = document.getElementById('reg-pass').value;
        const passConfirm = document.getElementById('reg-pass-confirm').value;

        if (!name || !email || !mobile || !pass || !passConfirm) {
          showToast('Please fill all required registration fields.', 'error');
          return;
        }

        if (mobile.length < 10) {
          showToast('Please enter a valid 10-digit mobile number.', 'error');
          return;
        }

        if (pass !== passConfirm) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        if (pass.length < 6) {
          showToast('Password must be at least 6 characters.', 'error');
          return;
        }

        // Check if verified email already exists
        const exists = stateObj.users.some(u => u.email.toLowerCase() === email && u.emailVerified);
        if (exists) {
          showToast('An active verified account with this email already exists.', 'error');
          return;
        }

        // Store pending unverified registration locally
        const pendingUser = {
          id: 'u_' + Date.now().toString(36),
          name,
          email,
          mobileNumber: mobile,
          rollNumber: roll,
          department: dept,
          year,
          semester: sem,
          password: pass,
          role: 'student',
          trustScore: 75,
          ratingAverage: 0,
          status: 'active',
          emailVerified: false,
          otpExpiry: Date.now() + 5 * 60 * 1000,
          otpAttempts: 0,
          lastOtpRequestAt: Date.now()
        };

        stateObj.pendingRegistrations = stateObj.pendingRegistrations.filter(p => p.email !== email);
        stateObj.pendingRegistrations.push(pendingUser);
        stateObj.save();

        // Dispatch Real-Time Email via Node Backend & PHP Backend
        try {
          const res = await fetch('http://localhost:5000/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name, email, mobileNumber: mobile, rollNumber: roll,
              department: dept, year, semester: sem,
              password: pass, confirmPassword: passConfirm
            })
          });
          const data = await res.json();
          if (res.ok && data && data.otp) {
            pendingUser.otpHash = await hashString(data.otp);
            stateObj.save();
          } else {
            throw new Error(data.message || 'Failed to dispatch email');
          }
        } catch(e) {
          const simulatedOtp = '123456';
          pendingUser.otpHash = await hashString(simulatedOtp);
          stateObj.save();
          console.log(`[SIMULATED REGISTRATION CODE for ${email}]: ${simulatedOtp}`);
          showToast(`[SIMULATED] Since backend is offline, please enter the simulated OTP: ${simulatedOtp}`, 'warning');
          
          try {
            fetch('php_backend/register.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name, email, mobileNumber: mobile, rollNumber: roll,
                department: dept, year, semester: sem,
                password: pass, confirmPassword: passConfirm
              })
            }).catch(() => {});
          } catch(err) {}
        }

        showToast(`6-Digit Verification code sent to ${email}! Check your inbox.`);
        this.navigateTo('verify_email', { email });
      },

      async handleResetPasswordSubmit(email) {
        const otp = document.getElementById('reset-otp').value.trim();
        const newPassword = document.getElementById('reset-pass').value;
        const confirmPassword = document.getElementById('reset-pass-confirm').value;

        if (!otp || !newPassword || !confirmPassword) {
          showToast('Please fill all fields.', 'error');
          return;
        }

        if (newPassword !== confirmPassword) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        if (newPassword.length < 6) {
          showToast('Password must be at least 6 characters.', 'error');
          return;
        }

        try {
          // Attempt Node API backend call
          const res = await fetch('http://localhost:5000/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp, newPassword, confirmPassword })
          });
          const data = await res.json();
          if (res.ok) {
            showToast(data.message);
            this.navigateTo('login');
          } else {
            throw new Error(data.message || 'Reset failed.');
          }
        } catch (e) {
          // Fallback simulation mode
          const user = stateObj.users.find(u => u.email.toLowerCase() === email);
          if (!user) {
            showToast('Account not found.', 'error');
            return;
          }

          if (user.otpAttempts >= 5) {
            showToast('Maximum reset attempts exceeded. Please request a new code.', 'error');
            return;
          }

          if (Date.now() > user.otpExpiry) {
            showToast('Reset verification code has expired. Request a new one.', 'error');
            return;
          }

          if (user.otpCode !== otp) {
            user.otpAttempts = (user.otpAttempts || 0) + 1;
            stateObj.save();
            const left = Math.max(0, 5 - user.otpAttempts);
            showToast(`Incorrect reset code. ${left} attempt(s) left.`, 'error');
            return;
          }

          // Successful Reset
          user.password = newPassword;
          user.otpCode = null;
          user.otpExpiry = null;
          user.otpAttempts = 0;
          stateObj.save();

          showToast('Password updated successfully. You can now login.');
          this.navigateTo('login');
        }
      },

      startResendTimer(seconds = 60) {
        if (this.resendTimerInterval) {
          clearInterval(this.resendTimerInterval);
        }

        this.resendCountdown = seconds;
        const updateUI = () => {
          const btn = document.getElementById('resend-otp-btn');
          const span = document.getElementById('resend-timer-span');
          if (btn && span) {
            if (this.resendCountdown > 0) {
              btn.disabled = true;
              span.textContent = `(${this.resendCountdown}s)`;
            } else {
              btn.disabled = false;
              span.textContent = '';
            }
          }
        };

        updateUI();

        this.resendTimerInterval = setInterval(() => {
          this.resendCountdown--;
          updateUI();
          if (this.resendCountdown <= 0) {
            clearInterval(this.resendTimerInterval);
            this.resendTimerInterval = null;
          }
        }, 1000);
      },

      async handleResendOtp() {
        if (this.resendCountdown > 0) return;

        const email = this.viewParams.email;
        const pending = stateObj.pendingRegistrations.find(p => p.email === email);
        if (!pending) {
          showToast('No pending registration found. Please register again.', 'error');
          this.navigateTo('register');
          return;
        }

        // Rate Limiting Check (60 seconds)
        const elapsed = (Date.now() - (pending.lastOtpRequestAt || 0)) / 1000;
        if (elapsed < 60) {
          const wait = Math.ceil(60 - elapsed);
          showToast(`Please wait ${wait} second(s) before requesting a new code.`, 'error');
          this.startResendTimer(wait);
          return;
        }

        pending.otpExpiry = Date.now() + 5 * 60 * 1000;
        pending.otpAttempts = 0;
        pending.lastOtpRequestAt = Date.now();
        stateObj.save();

        // Dispatch Real-Time Resend Email to Node Backend (Port 5000) and PHP Backend (XAMPP)
        try {
          const res = await fetch('http://localhost:5000/api/auth/resend-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          if (res.ok && data && data.otp) {
            pending.otpHash = await hashString(data.otp);
            stateObj.save();
          } else {
            throw new Error(data.message || 'Resend failed');
          }

          fetch('php_backend/resend_otp.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          }).catch(() => {});
        } catch(e) {
          const simulatedOtp = '123456';
          pending.otpHash = await hashString(simulatedOtp);
          stateObj.save();
          console.log(`[SIMULATED RESEND CODE for ${email}]: ${simulatedOtp}`);
          showToast(`[SIMULATED] Since backend is offline, please enter the simulated OTP: ${simulatedOtp}`, 'warning');
        }

        showToast(`Fresh verification code sent to ${email}!`);
        this.startResendTimer(60);
        this.render();
      },

      async handleVerifyOtpSubmit() {
        const email = this.viewParams.email;
        const otpInput = document.getElementById('otp-code-input');
        const otp = otpInput ? otpInput.value.trim() : '';

        if (!otp || otp.length !== 6 || !/^\d+$/.test(otp)) {
          showToast('Please enter the 6-digit verification code sent to your email.', 'error');
          return;
        }

        const pending = stateObj.pendingRegistrations.find(p => p.email === email);
        if (!pending) {
          showToast('Registration session not found. Please register again.', 'error');
          this.navigateTo('register');
          return;
        }

        // 2. Check 5-Minute Expiry
        if (Date.now() > pending.otpExpiry) {
          showToast('Verification code has expired (5-minute validity). Please click Resend Code.', 'error');
          return;
        }

        let verifiedOnBackend = false;

        // Try Node Backend verification first
        try {
          const res = await fetch('http://localhost:5000/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, otp })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            verifiedOnBackend = true;
          } else if (res.status === 400 || res.status === 429) {
            pending.otpAttempts = (pending.otpAttempts || 0) + 1;
            stateObj.save();
            const remaining = Math.max(0, 5 - pending.otpAttempts);
            showToast(data.message || `Invalid code. ${remaining} attempt(s) remaining.`, 'error');
            this.render();
            return;
          }
        } catch(e) {
          // Try PHP backend
          try {
            const phpRes = await fetch('php_backend/verify_otp.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, otp })
            });
            const phpData = await phpRes.json();
            if (phpRes.ok && phpData.success) {
              verifiedOnBackend = true;
            }
          } catch(err) {}
        }

        // Verify against hash or backend confirmation
        const inputHash = await hashString(otp);
        if (verifiedOnBackend || (pending.otpHash && inputHash === pending.otpHash)) {
          pending.emailVerified = true;
          delete pending.otpHash;
          delete pending.otpExpiry;
          delete pending.otpAttempts;
          delete pending.demoOtp;

          stateObj.pendingRegistrations = stateObj.pendingRegistrations.filter(p => p.email !== email);
          stateObj.users = stateObj.users.filter(u => u.email !== email);
          stateObj.users.push(pending);
          stateObj.currentUser = pending;
          stateObj.save();

          showToast('Email verified successfully! Profile activated.');
          this.navigateTo('dashboard');
        } else {
          pending.otpAttempts = (pending.otpAttempts || 0) + 1;
          stateObj.save();
          const remaining = Math.max(0, 5 - pending.otpAttempts);
          showToast(`Invalid verification code. Please check your email inbox. (${remaining} attempts left)`, 'error');
          this.render();
        }
      },

          showToast('You cannot request your own listed resource.', 'error');

        // Restriction Check: Maximum 3 active borrow operations

      submitBorrowRequest(itemId) {
        const user = stateObj.currentUser;
        const item = stateObj.resources.find(r => r.id === itemId);
        if (!item) return;

        const listingMethod = item.listingMethod || 'rent';
        const reqQtyInput = document.getElementById('req-quantity');
        const quantity = reqQtyInput ? Math.max(1, parseInt(reqQtyInput.value) || 1) : 1;
        const purpose = document.getElementById('req-purpose')?.value.trim() || 'Lending Proposal';

        let newTx = {
          id: 'tx_' + Date.now().toString(36) + Math.random().toString(36).substring(7),
          resourceId: item.id,
          resourceName: item.name,
          borrowerId: user.id,
          borrowerName: user.name,
          ownerId: item.ownerId,
          ownerName: item.ownerName,
          quantity: quantity,
          txType: listingMethod,
          price: item.price || 0,
          paymentStatus: 'Pending',
          actualReturnDate: null,
          purpose: purpose,
          initialCondition: item.condition,
          initialPhotos: item.image ? [item.image] : [],
          returnCondition: '',
          returnPhotos: [],
          status: 'Pending Request',
          deductionReason: '',
          deductionAmount: 0,
          remainingDeposit: 0,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };

        if (listingMethod === 'rent') {
          const returnDateVal = document.getElementById('req-return-date').value;
          if (!returnDateVal) {
            showToast('Please select a proposed return date.', 'error');
            return;
          }
          newTx.expectedReturnDate = returnDateVal;
          newTx.borrowDate = new Date().toISOString().split('T')[0];
          newTx.itemValue = item.itemValue || 1000;
          newTx.securityDeposit = Math.round((item.itemValue || 1000) * 0.35 * quantity);
          newTx.depositRequired = true;
          newTx.depositStatus = 'Pending';
          
          const diffTime = Math.abs(new Date(returnDateVal) - new Date());
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) || 1;
          newTx.rentalDays = diffDays;
        } else if (listingMethod === 'sell') {
          newTx.expectedReturnDate = new Date().toISOString().split('T')[0];
          newTx.itemValue = item.price || 0;
          newTx.securityDeposit = 0;
          newTx.depositRequired = false;
          newTx.depositStatus = 'N/A';
        } else if (listingMethod === 'exchange') {
          const swapSelect = document.getElementById('req-swap-item');
          if (!swapSelect || !swapSelect.value) {
            showToast('You must select an item of your own to propose for exchange.', 'error');
            return;
          }
          newTx.swapResourceId = swapSelect.value;
          newTx.expectedReturnDate = new Date().toISOString().split('T')[0];
          newTx.itemValue = item.itemValue || 1000;
          newTx.securityDeposit = 0;
          newTx.depositRequired = false;
          newTx.depositStatus = 'N/A';
          newTx.paymentStatus = 'N/A';
        }

        stateObj.transactions.unshift(newTx);

        // Notifications & automatic messages
        stateObj.notifications.unshift({
          id: 'n_' + Date.now().toString(36),
          userId: item.ownerId,
          content: `📬 New ${listingMethod.toUpperCase()} Request: ${user.name} requested "${item.name}".`,
          type: 'request_received',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.messages.push({
          id: 'msg_auto_' + Date.now().toString(36),
          senderId: user.id,
          receiverId: item.ownerId,
          content: `Hi ${item.ownerName}, I have proposed a ${listingMethod} request for your item "${item.name}". Please check your dashboard!`,
          timestamp: new Date().toISOString()
        });

        stateObj.save();
        this.closeModal();
        showToast('Request sent successfully!');
        this.navigateTo('my_borrowings');
      },

      async acceptBorrowRequest(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        const txType = tx.txType || 'rent';

        if (txType === 'rent') {
          const depositInput = document.getElementById(`deposit-input-${txId}`);
          const returnDateInput = document.getElementById(`return-date-${txId}`);
          const photosInput = document.getElementById(`initial-photos-${txId}`);

          const depositAmount = depositInput ? parseInt(depositInput.value) || 0 : 0;
          const returnDate = returnDateInput ? returnDateInput.value : tx.expectedReturnDate;

          let initialPhotoBase64 = tx.initialPhotos || [];
          if (photosInput && photosInput.files[0]) {
            const b64 = await new Promise(resolve => {
              const reader = new FileReader();
              reader.onloadend = () => resolve(reader.result);
              reader.readAsDataURL(photosInput.files[0]);
            });
            initialPhotoBase64 = [b64];
          }

          tx.securityDeposit = depositAmount;
          tx.depositRequired = depositAmount > 0;
          tx.expectedReturnDate = returnDate;
          tx.initialPhotos = initialPhotoBase64;
          tx.depositStatus = 'Pending';
        }

        tx.status = 'Accepted';
        tx.updatedAt = new Date().toISOString();

        stateObj.notifications.unshift({
          id: 'n_acc_' + Date.now().toString(36),
          userId: tx.borrowerId,
          content: `✅ Proposal approved for "${tx.resourceName}". Please confirm the agreement and make necessary payments.`,
          type: 'agreement_pending',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        showToast('Proposal approved! Partner notified.');
        this.render();
      },

      rejectBorrowRequest(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        tx.status = 'Cancelled';
        tx.updatedAt = new Date().toISOString();

        const item = stateObj.resources.find(r => r.id === tx.resourceId);
        if (item) item.availability = 'available';

        stateObj.notifications.unshift({
          id: 'n_rej_' + Date.now().toString(36),
          userId: tx.borrowerId,
          content: `❌ Proposal declined for "${tx.resourceName}".`,
          type: 'request_declined',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        showToast('Request declined.');
        this.render();
      },

      ownerConfirmHandover(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        if (tx.txType === 'sell') {
          tx.status = 'Returned'; // closed transaction
          tx.actualReturnDate = new Date().toISOString().split('T')[0];
          
          // Transfer ownership of 1 unit of stock
          const item = stateObj.resources.find(r => r.id === tx.resourceId);
          if (item) {
            item.availableQuantity = Math.max(0, (item.availableQuantity || 1) - tx.quantity);
            if (item.availableQuantity === 0) item.availability = 'borrowed';
          }
          
          stateObj.notifications.unshift({
            id: 'n_sell_comp_' + Date.now().toString(36),
            userId: tx.borrowerId,
            content: `🎁 Sale completed! Handover of "${tx.resourceName}" confirmed by owner.`,
            type: 'sale_completed',
            createdAt: new Date().toISOString(),
            isRead: false
          });
          
          showToast('Sale completed! Handover confirmed.');
        } else {
          tx.status = 'Active Borrow';
          
          // Deduct from resource stock
          const item = stateObj.resources.find(r => r.id === tx.resourceId);
          if (item) {
            item.availableQuantity = Math.max(0, (item.availableQuantity || 1) - tx.quantity);
            if (item.availableQuantity === 0) item.availability = 'borrowed';
          }
          
          stateObj.notifications.unshift({
            id: 'n_rent_act_' + Date.now().toString(36),
            userId: tx.borrowerId,
            content: `🔑 Handover confirmed! Your rental for "${tx.resourceName}" is now active.`,
            type: 'rent_active',
            createdAt: new Date().toISOString(),
            isRead: false
          });
          
          showToast('Rental activated!');
        }

        tx.updatedAt = new Date().toISOString();
        stateObj.save();
        this.render();
      },

      confirmExchangeHandover(txId, party) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        if (party === 'owner') {
          tx.ownerHandedOver = true;
        } else {
          tx.borrowerHandedOver = true;
        }

        if (tx.ownerHandedOver && tx.borrowerHandedOver) {
          tx.status = 'Returned'; // Completed Swap
          tx.actualReturnDate = new Date().toISOString().split('T')[0];
          
          // Swapping item logic
          const mainItem = stateObj.resources.find(r => r.id === tx.resourceId);
          const swapItem = stateObj.resources.find(r => r.id === tx.swapResourceId);

          if (mainItem) {
            mainItem.availableQuantity = Math.max(0, (mainItem.availableQuantity || 1) - 1);
            if (mainItem.availableQuantity === 0) mainItem.availability = 'borrowed';
          }
          if (swapItem) {
            swapItem.availableQuantity = Math.max(0, (swapItem.availableQuantity || 1) - 1);
            if (swapItem.availableQuantity === 0) swapItem.availability = 'borrowed';
          }

          stateObj.notifications.unshift({
            id: 'n_sw_co_o_' + Date.now().toString(36),
            userId: tx.ownerId,
            content: `🔄 Swap completed successfully for "${tx.resourceName}"!`,
            type: 'exchange_completed',
            createdAt: new Date().toISOString(),
            isRead: false
          });

          stateObj.notifications.unshift({
            id: 'n_sw_co_b_' + Date.now().toString(36),
            userId: tx.borrowerId,
            content: `🔄 Swap completed successfully for "${tx.resourceName}"!`,
            type: 'exchange_completed',
            createdAt: new Date().toISOString(),
            isRead: false
          });

          showToast('Swap complete! Both handovers verified.');
        } else {
          showToast('Handover confirmed! Awaiting confirmation from partner.');
        }

        tx.updatedAt = new Date().toISOString();
        stateObj.save();
        this.render();
      },

      confirmBorrowAgreement(txId) {
        const checkbox = document.getElementById('agreement-checkbox');
        if (!checkbox || !checkbox.checked) {
          showToast('Please check the confirmation box.', 'error');
          return;
        }

        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        tx.paymentStatus = 'Paid';
        tx.updatedAt = new Date().toISOString();

        stateObj.notifications.unshift({
          id: 'n_pay_conf_' + Date.now().toString(36),
          userId: tx.ownerId,

        });

        stateObj.save();
        this.closeModal();
        showToast('Payment Simulation Successful! Transaction paid.');

      },

      requestReturnHandover(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        tx.status = 'Return Requested';
        tx.updatedAt = new Date().toISOString();

        stateObj.notifications.unshift({
          id: 'n_ret_req_' + Date.now().toString(36),
          userId: tx.ownerId,
          content: `📦 Return Handover: ${tx.borrowerName} has requested to return "${tx.resourceName}". Inspect condition & confirm release.`,
          type: 'return_requested',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        showToast('Return requested! Owner notified for condition inspection.');
        this.render();
      },

      async confirmReturnAndRelease(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        const photoInput = document.getElementById(`return-photos-${txId}`);
        let returnPhotos = [];
        if (photoInput && photoInput.files[0]) {
          const b64 = await new Promise(resolve => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(photoInput.files[0]);
          });
          returnPhotos = [b64];
        }

        tx.status = 'Returned';
        tx.depositStatus = 'Released';
        tx.actualReturnDate = new Date().toISOString().split('T')[0];
        tx.returnPhotos = returnPhotos;
        tx.updatedAt = new Date().toISOString();

        const res = stateObj.resources.find(r => r.id === tx.resourceId);
        if (res) {
          const returnedQty = tx.quantity || 1;
          const totalQty = res.quantity || 1;
          const currentAvail = res.availableQuantity !== undefined ? res.availableQuantity : 0;
          res.availableQuantity = Math.min(totalQty, currentAvail + returnedQty);
          if (res.availableQuantity > 0) {
            res.availability = 'available';
          }
        }

        const borrower = stateObj.users.find(u => u.id === tx.borrowerId);
        if (borrower) {
          borrower.trustScore = Math.min(100, borrower.trustScore + 5);
        }

        stateObj.notifications.unshift({
          id: 'n_ret_rel_' + Date.now().toString(36),
          userId: tx.borrowerId,
          content: `🎉 Return Confirmed! Owner verified condition of "${tx.resourceName}". Security Deposit of ₹${tx.securityDeposit || 0} is Released. Trust Score +5!`,
          type: 'deposit_released',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        showToast('Return confirmed and security deposit released!');
        this.render();
      },

      openDeductionModal(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        const modalHtml = `
          <div class="space-y-5">

      submitDeductionProposal(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        const reason = document.getElementById('deduction-reason').value.trim();
        const amount = parseInt(document.getElementById('deduction-amount').value) || 0;

        if (!reason || amount <= 0) {
          showToast('Please provide a deduction reason and positive amount.', 'error');
          return;
        }

        if (amount > (tx.securityDeposit || 0)) {
          showToast(`Deduction cannot exceed deposit amount (₹${tx.securityDeposit}).`, 'error');
          return;
        }

        tx.deductionReason = reason;
        tx.deductionAmount = amount;
        tx.remainingDeposit = (tx.securityDeposit || 0) - amount;
        tx.depositStatus = amount === tx.securityDeposit ? 'Fully Deducted' : 'Partially Deducted';
        tx.updatedAt = new Date().toISOString();

        stateObj.notifications.unshift({
          id: 'n_ded_prop_' + Date.now().toString(36),
          userId: tx.borrowerId,
          content: `⚠️ Deposit Deduction Notice: Owner proposed ₹${amount} deduction for "${tx.resourceName}". Reason: "${reason}". Please review to accept or dispute.`,
          type: 'deduction_proposal',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        this.closeModal();
        showToast('Deduction proposal submitted to borrower.');
        this.render();
      },

      acceptDeduction(txId) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        tx.status = 'Returned';
        tx.actualReturnDate = new Date().toISOString().split('T')[0];
        tx.updatedAt = new Date().toISOString();

        const res = stateObj.resources.find(r => r.id === tx.resourceId);
        if (res) res.availability = 'available';

        const borrower = stateObj.users.find(u => u.id === tx.borrowerId);
        if (borrower) {
          borrower.trustScore = Math.max(30, borrower.trustScore - 5);
        }

        stateObj.notifications.unshift({
          id: 'n_ded_acc_' + Date.now().toString(36),
          userId: tx.ownerId,
          content: `Borrower ${tx.borrowerName} accepted the deduction of ₹${tx.deductionAmount} for "${tx.resourceName}".`,
          type: 'deduction_accepted',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        showToast('Deduction accepted. Transaction closed.');
        this.render();
      },

      disputeDeduction(txId) {
        const statement = window.prompt('Enter your reason for disputing this deposit deduction:');
        if (!statement) return;

        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        tx.status = 'Disputed';
        tx.depositStatus = 'Disputed';
        tx.borrowerDisputeNote = statement;
        tx.updatedAt = new Date().toISOString();

        stateObj.notifications.unshift({
          id: 'n_disp_adm_' + Date.now().toString(36),
          userId: 'u_admin',
          content: `🚨 DISPUTED TRANSACTION: ${tx.borrowerName} disputed ₹${tx.deductionAmount} deduction by ${tx.ownerName} on "${tx.resourceName}". Review required.`,
          type: 'dispute_alert',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.notifications.unshift({
          id: 'n_disp_own_' + Date.now().toString(36),
          userId: tx.ownerId,
          content: `${tx.borrowerName} has disputed the deduction for "${tx.resourceName}". Case forwarded to Admin.`,
          type: 'dispute_alert',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        showToast('Dispute submitted. Admin has been notified for arbitration.');
        this.render();
      },

        const methodContainer = document.getElementById('listing-method-container');
        const saleContainer = document.getElementById('sale-price-container');
        const swapContainer = document.getElementById('swap-preferences-container');

        if (type === 'Digital Resource') {
          if (fields) fields.style.display = 'none';
          if (valContainer) valContainer.style.display = 'none';
          if (methodContainer) methodContainer.style.display = 'none';
          if (saleContainer) saleContainer.style.display = 'none';
          if (swapContainer) swapContainer.style.display = 'none';
        } else {
          if (fields) fields.style.display = 'block';
          if (valContainer) valContainer.style.display = 'grid';
          if (methodContainer) methodContainer.style.display = 'block';
          this.toggleListingMethodFields();
        }

      toggleListingMethodFields() {
        const method = document.getElementById('share-method').value;
        const saleContainer = document.getElementById('sale-price-container');
        const swapContainer = document.getElementById('swap-preferences-container');
        const durationContainer = document.getElementById('lending-duration-container');

        if (method === 'rent') {
          if (saleContainer) saleContainer.style.display = 'none';
          if (swapContainer) swapContainer.style.display = 'none';
          if (durationContainer) durationContainer.style.display = 'block';
        } else if (method === 'sell') {
          if (saleContainer) saleContainer.style.display = 'block';
          if (swapContainer) swapContainer.style.display = 'none';
          if (durationContainer) durationContainer.style.display = 'none';
        } else if (method === 'exchange') {
          if (saleContainer) saleContainer.style.display = 'none';
          if (swapContainer) swapContainer.style.display = 'block';
          if (durationContainer) durationContainer.style.display = 'none';
        }
      },

      async handleShareSubmit() {
        const name = document.getElementById('share-name').value.trim();
        const category = document.getElementById('share-cat').value;
        const type = document.getElementById('share-type').value;
        const desc = document.getElementById('share-desc').value.trim();
        const photoFile = document.getElementById('share-photo-file').files[0];
        const itemValInput = document.getElementById('share-item-value');
        const itemValue = itemValInput ? (parseInt(itemValInput.value) || 1000) : 1000;
        const qtyInput = document.getElementById('share-quantity');
        const quantity = (type === 'Physical Item' && qtyInput) ? Math.max(1, parseInt(qtyInput.value) || 1) : 1;

        if (!name || !desc) {
          showToast('Please fill all required inputs.', 'error');
          return;
        }

        let base64Photo = '';
        if (photoFile) {
          base64Photo = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(photoFile);
          });
        }

        const user = stateObj.currentUser;
        const cond = type === 'Digital Resource' ? 'New' : document.getElementById('share-condition').value;
        const dur = type === 'Digital Resource' ? 0 : parseInt(document.getElementById('share-duration').value);

        // EXTRA FIELDS FOR THE 3 METHODS
        const method = type === 'Digital Resource' ? 'rent' : document.getElementById('share-method').value;
        const priceInput = document.getElementById('share-price');
        const price = (type === 'Physical Item' && method === 'sell' && priceInput) ? (parseInt(priceInput.value) || 0) : 0;
        const swapInput = document.getElementById('share-swap-pref');
        const swapPreferences = (type === 'Physical Item' && method === 'exchange' && swapInput) ? swapInput.value.trim() : '';

        const newResource = {
          id: 'r_' + Date.now().toString(36),
          ownerId: user.id,
          ownerName: user.name,
          name,
          category,
          description: desc,
          type,
          condition: cond,
          itemValue: itemValue,
          quantity: quantity,
          availableQuantity: quantity,
          availability: 'available',
          lendingDuration: dur,
          listingMethod: method,
          price: price,
          swapPreferences: swapPreferences,
          location: type === 'Digital Resource' ? 'Online' : 'Hostel / Campus Lobby',
          image: base64Photo,
          ratingAverage: 0
        };

        // Try API Backend first
        try {
          await fetch('http://localhost:5000/api/resources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ownerId: user.id,
              ownerName: user.name,
              name,
              category,
              description: desc,
              type,
              condition: cond,
              itemValue: itemValue,
              quantity: quantity,
              lendingDuration: dur,
              listingMethod: method,
              price: price,
              swapPreferences: swapPreferences,
              location: type === 'Digital Resource' ? 'Online' : 'Hostel / Campus Lobby',
              image: base64Photo
            })
          });
        } catch(e) {}

        stateObj.resources.unshift(newResource);
        stateObj.save();
        showToast('Resource added successfully!');
        if (type === 'Digital Resource') {
          this.navigateTo('study_materials');
        } else {
          this.navigateTo('explore');
        }
      },

        const user = stateObj.currentUser;
        const val = document.getElementById('chat-input-box').value;
        if (!val.trim()) return;

        const newMsg = {
          id: 'msg_' + Date.now().toString(36),
          senderId: user.id,
          receiverId: partnerId,
          content: val,
          timestamp: new Date().toISOString()
        };

        stateObj.messages.push(newMsg);
        stateObj.save();

        this.selectChat(partnerId);

        setTimeout(() => {
          stateObj.messages.push({
            id: 'msg_reply_' + Date.now().toString(36),
            senderId: partnerId,
            receiverId: user.id,
            content: `Understood! Let's meet at the library desk.`,
            timestamp: new Date().toISOString()

          this.selectChat(partnerId);

        const allTxs = stateObj.transactions;
        const pendingRequestsCount = allTxs.filter(t => t.status === 'Pending Request').length;
        const activeBorrowingsCount = allTxs.filter(t => t.status === 'Active Borrow' || t.status === 'Return Requested').length;
        const overdueTxs = allTxs.filter(t => t.status === 'Overdue');
        const disputedTxs = allTxs.filter(t => t.status === 'Disputed');
        const returnedTxs = allTxs.filter(t => t.status === 'Returned');
        
        const totalDepositsRecorded = allTxs
          .filter(t => ['Paid/Held', 'Released', 'Partially Deducted', 'Fully Deducted'].includes(t.depositStatus))
          .reduce((acc, t) => acc + (t.securityDeposit || 0), 0);

        const verifiedStudents = stateObj.users.filter(u => u.role !== 'admin' && u.emailVerified);
        const restrictedStudents = verifiedStudents.filter(u => getTrustLevel(u).level === 'Restricted');

        return `
          <div class="space-y-8 text-left">
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-2xl font-bold text-rose-600 dark:text-rose-400">Admin Arbitration & Oversight</h1>
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/10 text-rose-600">Full Access</span>
              </div>
              <p class="text-slate-500 text-xs mt-1">Resolve deposit deduction disputes, inspect overdue borrowings, moderate students, and review transaction logs.</p>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                <span class="text-[10px] text-slate-400 block uppercase font-bold">Active Borrowings</span>
                <strong class="text-2xl font-black block mt-1 text-slate-900 dark:text-white">${activeBorrowingsCount}</strong>
              </div>
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                <span class="text-[10px] text-slate-400 block uppercase font-bold">Pending Requests</span>
                <strong class="text-2xl font-black block mt-1 text-amber-500">${pendingRequestsCount}</strong>
              </div>
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                <span class="text-[10px] text-slate-400 block uppercase font-bold">Overdue Items</span>
                <strong class="text-2xl font-black text-rose-500 block mt-1">${overdueTxs.length}</strong>
              </div>
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                <span class="text-[10px] text-slate-400 block uppercase font-bold">Total Deposits Recorded</span>
                <strong class="text-2xl font-black text-emerald-500 block mt-1">₹${totalDepositsRecorded}</strong>
              </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-5">
              <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm text-xs">
                <span class="text-slate-400 block font-semibold">Disputed Transactions:</span>
                <strong class="text-lg font-bold text-purple-600 dark:text-purple-400">${disputedTxs.length} cases</strong>
              </div>
              <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm text-xs">
                <span class="text-slate-400 block font-semibold">Returned Items:</span>
                <strong class="text-lg font-bold text-emerald-600">${returnedTxs.length} completed</strong>
              </div>
              <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm text-xs">
                <span class="text-slate-400 block font-semibold">Verified Students:</span>
                <strong class="text-lg font-bold text-slate-900 dark:text-white">${verifiedStudents.length} students</strong>
              </div>
            </div>

            <!-- DISPUTES RESOLUTION PANEL -->
            <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
              <h3 class="font-bold text-sm text-purple-600 dark:text-purple-400 flex items-center gap-2">
                <i data-lucide="scale" class="w-4 h-4"></i>
                Deposit Deduction Disputes (${disputedTxs.length})
              </h3>

              ${disputedTxs.length === 0 ? '<p class="text-xs text-slate-400 py-4 text-center">No active deposit disputes.</p>' : `
                <div class="space-y-4">
                  ${disputedTxs.map(tx => `
                    <div class="p-5 rounded-2xl bg-purple-50/50 dark:bg-purple-950/20 border border-purple-200/60 dark:border-purple-800/60 space-y-3 text-xs">
                      <div class="flex items-center justify-between">
                        <span class="font-bold text-sm">${tx.resourceName}</span>
                        <span class="font-bold text-purple-600">Disputed Deposit: ₹${tx.securityDeposit} (Deduction: ₹${tx.deductionAmount})</span>
                      </div>

                      <div class="grid grid-cols-2 gap-4 p-3 bg-white dark:bg-slate-900 rounded-xl">
                        <div>
                          <span class="text-[10px] text-slate-400 font-bold block uppercase">Owner Claim (${tx.ownerName})</span>
                          <p class="mt-0.5">"${tx.deductionReason}"</p>
                        </div>
                        <div>
                          <span class="text-[10px] text-slate-400 font-bold block uppercase">Borrower Statement (${tx.borrowerName})</span>
                          <p class="mt-0.5">"${tx.borrowerDisputeNote || 'Disputed deduction claim'}"</p>
                        </div>
                      </div>

                      <div class="flex items-center justify-between pt-2">
                        <button onclick="App.viewConditionPhotos('${tx.id}')" class="text-brand-500 font-bold hover:underline">Inspect Photos</button>
                        <div class="flex gap-2">
                          <button onclick="App.adminResolveDispute('${tx.id}', 'refund_borrower')" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg font-bold">Refund Full to Borrower</button>
                          <button onclick="App.adminResolveDispute('${tx.id}', 'grant_owner')" class="px-3 py-1.5 bg-rose-600 text-white rounded-lg font-bold">Approve Owner Deduction</button>
                          <button onclick="App.adminResolveDispute('${tx.id}', 'split')" class="px-3 py-1.5 bg-purple-600 text-white rounded-lg font-bold">Split 50/50</button>
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- OVERDUE ITEMS TABLE -->
            <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
              <h3 class="font-bold text-sm text-rose-500 flex items-center gap-2">
                <i data-lucide="alert-octagon" class="w-4 h-4"></i>
                Overdue Borrowings Oversight (${overdueTxs.length})
              </h3>
              ${overdueTxs.length === 0 ? '<p class="text-xs text-slate-400 py-3 text-center">No overdue items currently recorded.</p>' : `
                <div class="divide-y divide-slate-100 dark:divide-slate-800 text-xs">
                  ${overdueTxs.map(tx => `
                    <div class="py-3 flex items-center justify-between">
                      <div>
                        <span class="font-bold block">${tx.resourceName}</span>
                        <span class="text-[10px] text-slate-400">Borrower: ${tx.borrowerName} • Owner: ${tx.ownerName} • Deposit: ₹${tx.securityDeposit}</span>
                      </div>
                      <button onclick="App.warnUser('${tx.borrowerId}', '${tx.resourceName}')" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-bold text-[10px]">Send Penalty Warning</button>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

            <!-- STUDENT CONTROL & RESTRICTION LIST -->
            <div class="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
              <h3 class="font-bold text-xs uppercase tracking-wider text-slate-400">Verified Student Directory</h3>
              <div class="divide-y divide-slate-100 dark:divide-slate-800">
                ${verifiedStudents.length === 0 ? '<div class="text-xs text-slate-400 py-4">No registered verified students yet.</div>' : verifiedStudents.map(student => {
                  const stTrust = getTrustLevel(student);
                  return `
                    <div class="flex items-center justify-between py-3 text-xs">
                      <div>
                        <span class="font-bold block">${student.name} <span class="text-[10px] text-slate-400 font-normal">(${student.department} • ${student.mobileNumber || 'No Phone'})</span></span>
                        <span class="text-[10px] text-slate-400">Trust: <strong>${student.trustScore} pts</strong> • Level: <span class="font-bold ${stTrust.badgeClass} px-1.5 py-0.2 rounded-full">${stTrust.level}</span> • Email: <span class="text-emerald-500 font-bold">Verified</span></span>
                      </div>
                      <button onclick="App.toggleBlock('${student.id}')" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-white ${
                        student.status === 'blocked' ? 'bg-emerald-600' : 'bg-rose-600'
                      }">
                        ${student.status === 'blocked' ? 'Unblock' : 'Block Student'}
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      },

      adminResolveDispute(txId, action) {
        const tx = stateObj.transactions.find(t => t.id === txId);
        if (!tx) return;

        tx.status = 'Returned';
        tx.actualReturnDate = new Date().toISOString().split('T')[0];

        if (action === 'refund_borrower') {
          tx.depositStatus = 'Released';
          tx.deductionAmount = 0;
          showToast('Dispute resolved: Full deposit refunded to borrower.');
        } else if (action === 'grant_owner') {
          tx.depositStatus = tx.deductionAmount >= (tx.securityDeposit || 0) ? 'Fully Deducted' : 'Partially Deducted';
          showToast(`Dispute resolved: Approved ₹${tx.deductionAmount} deduction for owner.`);
        } else if (action === 'split') {
          tx.deductionAmount = Math.round((tx.securityDeposit || 0) / 2);
          tx.depositStatus = 'Partially Deducted';
          showToast(`Dispute resolved: 50/50 split applied (₹${tx.deductionAmount} deducted).`);
        }

        const res = stateObj.resources.find(r => r.id === tx.resourceId);
        if (res) res.availability = 'available';

        stateObj.notifications.unshift({
          id: 'n_adm_res_' + Date.now().toString(36),
          userId: tx.borrowerId,
          content: `⚖️ Admin Arbitration Closed: Dispute for "${tx.resourceName}" resolved with status: ${tx.depositStatus}.`,
          type: 'dispute_resolved',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.notifications.unshift({
          id: 'n_adm_res_o_' + Date.now().toString(36),
          userId: tx.ownerId,
          content: `⚖️ Admin Arbitration Closed: Dispute for "${tx.resourceName}" resolved with status: ${tx.depositStatus}.`,
          type: 'dispute_resolved',
          createdAt: new Date().toISOString(),
          isRead: false
        });

        stateObj.save();
        this.render();
      },

      toggleBlock(id) {
        const student = stateObj.users.find(u => u.id === id);
        if (student) {
          student.status = student.status === 'blocked' ? 'active' : 'blocked';
          stateObj.save();
          showToast(`Student status updated.`);
          this.render();
        }
      },

      warnUser(userId, resName) {
        stateObj.notifications.unshift({
          id: 'n_' + Date.now().toString(36),
          userId,
          content: `ADMIN PENALTY WARNING: Return the overdue resource "${resName}" immediately to avoid suspension.`,
          type: 'overdue_warning',
          createdAt: new Date().toISOString(),
          isRead: false
        });
        stateObj.save();
        showToast('Penalty warning sent.');
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
